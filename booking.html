<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book an Appointment · Salon Lead Machine</title><style>:root{--g:#164b37;--bg:#f5f7f4;--line:#dfe6e0;--muted:#68756d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui;color:#17211b}.wrap{max-width:760px;margin:auto;padding:28px 16px 60px}.hero{background:linear-gradient(135deg,#123e2e,#28654b);color:#fff;border-radius:26px;padding:32px;margin-bottom:18px}.badge{display:inline-block;background:#dce9df;color:var(--g);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}.hero h1{font-size:42px;line-height:1;margin:14px 0 8px}.hero p{color:#dce9df;line-height:1.5}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff;font:inherit}.field textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}.btn{width:100%;border:0;background:var(--g);color:#fff;padding:14px;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer}.btn:disabled{opacity:.6;cursor:not-allowed}.notice{display:none;margin-top:14px;padding:13px;border-radius:12px;font-weight:700}.notice.ok{display:block;background:#edf6ef;color:var(--g)}.notice.err{display:block;background:#fff1f1;color:#9b1c1c}.source{font-size:12px;color:var(--muted);margin-top:10px}.confirmation{display:none;margin-top:18px;background:#f8fbf8;border:2px solid #cfe3d3;border-radius:18px;padding:20px}.confirmation.show{display:block}.confirmation h2{margin:0 0 6px;color:var(--g)}.confirmation .status{display:inline-block;background:#fff5df;color:#8a5b00;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;margin:8px 0 14px}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.detail small{display:block;color:var(--muted);font-size:11px;font-weight:800;margin-bottom:4px}.detail b{font-size:14px}.ref{font-size:12px;color:var(--muted);margin-top:14px;word-break:break-all}@media(max-width:600px){.grid,.details{grid-template-columns:1fr}.full{grid-column:auto}.hero h1{font-size:34px}}</style></head><body><main class="wrap"><section class="hero"><span class="badge">ONLINE BOOKING</span><h1 id="salonName">Book your appointment</h1><p id="salonCity">Loading salon…</p></section><section class="card"><form id="bookingForm" class="grid"><div class="field"><label>Your Name</label><input id="name" required maxlength="100" placeholder="Customer name"></div><div class="field"><label>Mobile Number</label><input id="phone" required inputmode="tel" maxlength="15" placeholder="10-digit mobile"></div><div class="field"><label>Service</label><select id="service"><option value="">Select a service</option></select></div><div class="field"><label>Appointment Date</label><input id="date" type="date" required></div><div class="field"><label>Preferred Time</label><input id="time" type="time"></div><div class="field full"><label>Notes</label><textarea id="notes" maxlength="1000" placeholder="Anything you'd like us to know?"></textarea></div><div class="full"><button class="btn" id="submit" type="submit">Request Appointment</button><div id="notice" class="notice"></div><div id="sourceText" class="source"></div></div></form><section id="confirmation" class="confirmation"><h2>Booking Request Received ✓</h2><div class="muted">Your appointment request has been recorded. The salon will contact you to confirm the final appointment.</div><div class="status">REQUESTED · AWAITING SALON CONFIRMATION</div><div class="details"><div class="detail"><small>Customer</small><b id="cName"></b></div><div class="detail"><small>Salon</small><b id="cSalon"></b></div><div class="detail"><small>Service</small><b id="cService"></b></div><div class="detail"><small>Date</small><b id="cDate"></b></div><div class="detail"><small>Preferred Time</small><b id="cTime"></b></div><div class="detail"><small>Mobile</small><b id="cPhone"></b></div></div><div class="ref">Booking Reference: <b id="cRef"></b></div></section></section></main><script>const SUPA='https://dhiimviybpbggvuuzwfh.supabase.co',KEY='sb_publishable_IOXACVkfe217drLmK0UCcA_ADmDLTg7',params=new URLSearchParams(location.search),salonId=params.get('salon'),source=(params.get('source')||'Website').replace(/[^A-Za-z]/g,'').slice(0,20)||'Website';const $=id=>document.getElementById(id);$('date').min=new Date().toISOString().slice(0,10);function show(t,err){$('notice').textContent=t;$('notice').className='notice '+(err?'err':'ok')}function prettyDate(v){if(!v)return 'Not specified';const p=String(v).split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:v}function prettyTime(v){return v?String(v).slice(0,5):'Not specified'}async function load(){if(!salonId){$('salonName').textContent='Booking link incomplete';$('salonCity').textContent='Please open the booking link provided by your salon.';$('bookingForm').style.display='none';return}try{const r=await fetch(SUPA+'/functions/v1/public-salon?id='+encodeURIComponent(salonId),{headers:{apikey:KEY}}),d=await r.json();if(!r.ok)throw Error(d.error||'Salon not found');$('salonName').textContent=d.salon.name;$('salonCity').textContent=(d.salon.city||'')+' · Choose a service, date and preferred time. The salon will confirm your appointment.';$('sourceText').textContent='Booking through '+source;for(const x of d.services||[]){const o=document.createElement('option');o.value=x.name;o.textContent=x.name+(x.price!=null?' · ₹'+Number(x.price).toLocaleString('en-IN'):'');$('service').appendChild(o)}}catch(e){show(e.message,true)}}$('bookingForm').addEventListener('submit',async e=>{e.preventDefault();const booking={name:$('name').value.trim(),phone:$('phone').value.trim(),service:$('service').value,appointment_date:$('date').value,appointment_time:$('time').value,notes:$('notes').value,source};$('submit').disabled=true;$('submit').textContent='Submitting…';try{const r=await fetch(SUPA+'/functions/v1/public-booking',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({salon_id:salonId,...booking})});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to create booking');show('Appointment request received. The salon will contact you to confirm.',false);$('cName').textContent=booking.name;$('cSalon').textContent=$('salonName').textContent;$('cService').textContent=booking.service||'Salon service';$('cDate').textContent=prettyDate(booking.appointment_date);$('cTime').textContent=prettyTime(booking.appointment_time);$('cPhone').textContent=booking.phone;$('cRef').textContent=d.appointment?.id||d.lead_id||'Created successfully';$('confirmation').classList.add('show');$('confirmation').scrollIntoView({behavior:'smooth',block:'start'});$('bookingForm').reset();$('date').min=new Date().toISOString().slice(0,10)}catch(e){show(e.message,true)}finally{$('submit').disabled=false;$('submit').textContent='Request Appointment'}});load();</script></body></html>
