<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book an Appointment · Salon Lead Machine</title><style>:root{--g:#164b37;--bg:#f5f7f4;--line:#dfe6e0;--muted:#68756d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui;color:#17211b}.wrap{max-width:760px;margin:auto;padding:28px 16px 60px}.hero{background:linear-gradient(135deg,#123e2e,#28654b);color:white;border-radius:26px;padding:32px;margin-bottom:18px}.badge{display:inline-block;background:#dce9df;color:var(--g);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}.hero .badge{color:var(--g)}h1{font-size:42px;line-height:1;margin:14px 0 8px}.hero p{color:#dce9df;line-height:1.5}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:white;font:inherit}.field textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}.btn{width:100%;border:0;background:var(--g);color:white;padding:14px;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer}.notice{display:none;margin-top:14px;padding:13px;border-radius:12px;font-weight:700}.notice.ok{display:block;background:#edf6ef;color:var(--g)}.notice.err{display:block;background:#fff1f1;color:#9b1c1c}.meta{color:var(--muted);font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}h1{font-size:34px}}</style></head><body><main class="wrap"><section class="hero"><span class="badge">ONLINE BOOKING</span><h1 id="salonName">Book your appointment</h1><p id="salonCity">Choose a service, date and preferred time. Your salon will confirm the appointment.</p></section><section class="card"><form id="bookingForm" class="grid"><div class="field"><label>Your Name</label><input id="name" required maxlength="100" placeholder="Customer name"></div><div class="field"><label>Mobile Number</label><input id="phone" required inputmode="tel" maxlength="15" placeholder="10-digit mobile"></div><div class="field"><label>Service</label><select id="service"><option value="">Select a service</option></select></div><div class="field"><label>Appointment Date</label><input id="date" type="date" required></div><div class="field"><label>Preferred Time</label><input id="time" type="time"></div><div class="field"><label>Booking Source</label><select id="source"><option>Website</option><option>Google</option><option>WhatsApp</option><option>Instagram</option><option>Facebook</option><option>Phone</option><option>Walk-in</option></select></div><div class="field full"><label>Notes</label><textarea id="notes" maxlength="1000" placeholder="Anything you'd like us to know?"></textarea></div><div class="full"><button class="btn" id="submit" type="submit">Request Appointment</button><div id="notice" class="notice"></div></div></form></section></main><script>const SUPA='https://dhiimviybpbggvuuzwfh.supabase.co',KEY='sb_publishable_IOXACVkfe217drLmK0UCcA_ADmDLTg7',params=new URLSearchParams(location.search),salonId=params.get('salon')||'38980d21-e9c7-423a-9b36-47c0a1eb6bfc';const $=id=>document.getElementById(id);$('date').min=new Date().toISOString().slice(0,10);async function load(){try{const r=await fetch(SUPA+'/rest/v1/salons?id=eq.'+encodeURIComponent(salonId)+'&select=name,city,google_phone,whatsapp',{headers:{apikey:KEY}});const a=await r.json();if(!a[0])throw Error('Salon not found');$('salonName').textContent=a[0].name;$('salonCity').textContent=(a[0].city||'')+' · Choose a service, date and preferred time. Your salon will confirm the appointment.';const s=await fetch(SUPA+'/rest/v1/salon_services?salon_id=eq.'+encodeURIComponent(salonId)+'&active=eq.true&select=name,price&order=sort_order',{headers:{apikey:KEY}});const services=await s.json();services.forEach(x=>{const o=document.createElement('option');o.value=x.name;o.textContent=x.name+(x.price!=null?' · ₹'+Number(x.price).toLocaleString('en-IN'):'');$('service').appendChild(o)})}catch(e){show(e.message,true)}}function show(t,err){$('notice').textContent=t;$('notice').className='notice '+(err?'err':'ok')}$('bookingForm').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;$('submit').textContent='Booking...';try{const r=await fetch(SUPA+'/functions/v1/public-booking',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({salon_id:salonId,name:$('name').value,phone:$('phone').value,service:$('service').value,appointment_date:$('date').value,appointment_time:$('time').value,notes:$('notes').value,source:$('source').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to create booking');show('Appointment request received. The salon will contact you to confirm.');$('bookingForm').reset();$('date').min=new Date().toISOString().slice(0,10)}catch(e){show(e.message,true)}finally{$('submit').disabled=false;$('submit').textContent='Request Appointment'}});load();</script></body></html>
