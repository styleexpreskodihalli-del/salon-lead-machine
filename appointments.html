<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appointments · Salon Lead Machine</title><style>:root{--g:#164b37;--bg:#f4f7f4;--line:#dfe6e0;--muted:#68756d;--danger:#9b3030;--warn:#8a5b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:#17211b}.wrap{max-width:1150px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-weight:950;color:var(--g);font-size:20px}.sub{color:var(--muted);font-size:13px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--g);color:#fff}.light{background:#fff;border:1px solid var(--line);color:var(--g)}.danger{background:#fff;border:1px solid #e8caca;color:var(--danger)}.login{max-width:520px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;text-align:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.stat b{display:block;font-size:30px;color:var(--g)}.stat span{font-size:12px;color:var(--muted);font-weight:800}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;font:inherit}.toolbar input{flex:1;min-width:190px}.list{display:grid;gap:12px}.appt{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;grid-template-columns:1.25fr 1fr 1fr 1.5fr;gap:14px;align-items:center}.name{font-weight:950;font-size:17px}.muted{color:var(--muted);font-size:13px;line-height:1.45}.badge{display:inline-block;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900;background:#edf6ef;color:var(--g)}.badge.req{background:#fff5df;color:var(--warn)}.badge.cancel{background:#fceeee;color:var(--danger)}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions select{padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff}.empty{text-align:center;padding:45px;color:var(--muted)}.notice{margin:0 0 18px;padding:14px 16px;background:#eaf5ed;border:1px solid #cfe3d3;border-radius:14px;color:var(--g);font-size:13px;font-weight:800}.section-title{margin:22px 0 10px;font-size:15px;font-weight:950}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.appt{grid-template-columns:1fr 1fr}}@media(max-width:560px){.appt{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div id="app"><div class="login">Checking your owner session…</div></div></main><script>
const SUPA='https://dhiimviybpbggvuuzwfh.supabase.co',KEY='sb_publishable_IOXACVkfe217drLmK0UCcA_ADmDLTg7',REDIRECT=location.origin+location.pathname;
const $=id=>document.getElementById(id);let session=null,salon=null,all=[];
function parseSession(){const h=new URLSearchParams(location.hash.replace(/^#/,'&'));const a=h.get('access_token'),r=h.get('refresh_token');if(a){session={access_token:a,refresh_token:r};localStorage.setItem('slm_session',JSON.stringify(session));history.replaceState({},'',location.pathname)}else{try{session=JSON.parse(localStorage.getItem('slm_session')||'null')}catch{session=null}}}
async function api(path,opt={}){return fetch(SUPA+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...(opt.headers||{})}})}
function login(){location.assign(SUPA+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(REDIRECT))}
async function boot(){parseSession();if(!session){$('app').innerHTML='<div class="login"><div class="brand">Salon Lead Machine</div><h1>Owner Appointments</h1><p class="muted">Sign in to view and manage appointments for your salon.</p><button class="btn primary" onclick="login()">Continue with Google</button></div>';return}try{const r=await api('/rest/v1/salons?select=id,name,city,whatsapp&limit=1');const rows=await r.json();if(!rows[0])throw Error('No salon is connected to this owner account. Complete Salon Setup first.');salon=rows[0];renderShell();await load()}catch(e){$('app').innerHTML='<div class="login"><h2>Owner setup required</h2><p class="muted">'+esc(e.message)+'</p><a class="btn light" href="index.html">Open Salon Setup</a></div>'}}
function renderShell(){$('app').innerHTML=`<header class="top"><div><div class="brand">Salon Lead Machine</div><div class="sub">${esc(salon.name)} · ${esc(salon.city||'')}</div></div><div class="actions"><a class="btn light" target="_blank" href="salon.html?salon=${encodeURIComponent(salon.id)}">Open My Salon</a><button class="btn primary" onclick="logout()">Sign out</button></div></header><div class="notice">New bookings arrive as <b>Requested</b>. Confirm the appointment below and send the customer a ready-to-send WhatsApp confirmation.</div><section class="stats"><div class="stat"><b id="total">0</b><span>TOTAL</span></div><div class="stat"><b id="requested">0</b><span>REQUESTED</span></div><div class="stat"><b id="confirmed">0</b><span>CONFIRMED</span></div><div class="stat"><b id="completed">0</b><span>COMPLETED</span></div></section><div class="toolbar"><input id="search" placeholder="Search customer or service" oninput="draw()"><input id="date" type="date" onchange="draw()"><select id="status" onchange="draw()"><option value="">All statuses</option><option>Requested</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option><option>No Show</option></select><button class="btn light" onclick="load()">Refresh</button></div><div class="section-title">Booking requests & appointments</div><section id="list" class="list"></section>`}
async function load(){const r=await api('/rest/v1/appointments?salon_id=eq.'+encodeURIComponent(salon.id)+'&select=id,lead_id,customer_name,customer_phone,service,appointment_date,appointment_time,status,notes,source,created_at&order=appointment_date.asc,appointment_time.asc,created_at.desc');if(!r.ok)throw Error(await r.text());all=await r.json();$('total').textContent=all.length;$('requested').textContent=all.filter(x=>x.status==='Requested').length;$('confirmed').textContent=all.filter(x=>x.status==='Confirmed').length;$('completed').textContent=all.filter(x=>x.status==='Completed').length;draw()}
function draw(){const q=($('search')?.value||'').toLowerCase(),d=$('date')?.value||'',st=$('status')?.value||'';const rows=all.filter(x=>(!q||((x.customer_name||'')+' '+(x.service||'')+' '+(x.customer_phone||'')).toLowerCase().includes(q))&&(!d||x.appointment_date===d)&&(!st||x.status===st));$('list').innerHTML=rows.length?rows.map(x=>{const badge=x.status==='Requested'?' req':(x.status==='Cancelled'||x.status==='No Show'?' cancel':'');return `<article class="appt"><div><div class="name">${esc(x.customer_name)}</div><div class="muted">${esc(x.service||'Service not selected')} · ${esc(x.source||'Website')}</div><div class="muted">${esc(x.customer_phone)}</div></div><div><span class="badge${badge}">${esc(x.status)}</span><div class="muted" style="margin-top:7px">${esc(formatDate(x.appointment_date))}${x.appointment_time?' · '+esc(formatTime(x.appointment_time)):''}</div></div><div class="muted">${esc(x.notes||'No notes')}</div><div class="actions">${x.status==='Requested'?`<button class="btn primary" onclick="confirmBooking('${x.id}')">✓ Confirm</button><button class="btn light" onclick="reschedule('${x.id}')">Reschedule</button><button class="btn danger" onclick="cancelBooking('${x.id}')">Cancel</button>`:x.status==='Confirmed'?`<button class="btn light" onclick="reschedule('${x.id}')">Reschedule</button><button class="btn danger" onclick="cancelBooking('${x.id}')">Cancel</button>`:''}<a class="btn light" href="tel:${esc(x.customer_phone)}">Call</a><a class="btn light" target="_blank" href="${waLink(x,'')}" >WhatsApp</a><select onchange="setStatus('${x.id}',this.value)"><option value="">Change</option>${['Requested','Confirmed','Completed','Cancelled','No Show'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div></article>`}).join(''):'<div class="panel empty">No appointments match your filters.</div>'}
async function confirmBooking(id){const x=all.find(a=>a.id===id);if(!x)return;if(!(await updateStatus(id,'Confirmed')))return;const msg=`Hi ${x.customer_name}, your appointment at ${salon.name} is confirmed.\n\nService: ${x.service||'Salon service'}\nDate: ${formatDate(x.appointment_date)}${x.appointment_time?'\nTime: '+formatTime(x.appointment_time):''}\n\nWe look forward to seeing you!`;window.open(waLink(x,msg),'_blank');await load()}
async function cancelBooking(id){const x=all.find(a=>a.id===id);if(!x)return;if(!confirm('Cancel this appointment?'))return;if(!(await updateStatus(id,'Cancelled')))return;const msg=`Hi ${x.customer_name}, your appointment request at ${salon.name} for ${formatDate(x.appointment_date)}${x.appointment_time?' at '+formatTime(x.appointment_time):''} could not be confirmed. Please message us if you would like another time.`;window.open(waLink(x,msg),'_blank');await load()}
async function reschedule(id){const x=all.find(a=>a.id===id);if(!x)return;const date=prompt('Enter the new appointment date (YYYY-MM-DD):',x.appointment_date||'');if(!date||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date))return;const time=prompt('Enter the new appointment time (HH:MM):',x.appointment_time||'');if(time&&!/^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(time))return;const r=await api('/rest/v1/appointments?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({appointment_date:date,appointment_time:time||null,status:'Requested',updated_at:new Date().toISOString()})});if(!r.ok){alert('Unable to reschedule appointment');return}const msg=`Hi ${x.customer_name}, we have a new appointment time for your request at ${salon.name}.\n\nService: ${x.service||'Salon service'}\nNew date: ${formatDate(date)}${time?'\nNew time: '+formatTime(time):''}\n\nPlease reply to confirm this new time.`;window.open(waLink(x,msg),'_blank');await load()}
async function updateStatus(id,status){const r=await api('/rest/v1/appointments?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status,updated_at:new Date().toISOString()})});if(!r.ok){alert('Unable to update appointment');return false}return true}
async function setStatus(id,status){if(!status)return;if(status==='Confirmed'){await confirmBooking(id);return}if(status==='Cancelled'){await cancelBooking(id);return}if(status==='Requested'||status==='Completed'||status==='No Show'){if(await updateStatus(id,status))await load()}}
function waLink(x,msg){const phone=(x.customer_phone||'').replace(/\D/g,'');return 'https://wa.me/'+encodeURIComponent(phone)+(msg?'?text='+encodeURIComponent(msg):'')}
function formatDate(v){if(!v)return '';const p=String(v).split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:v}
function formatTime(v){return String(v||'').slice(0,5)}
function logout(){localStorage.removeItem('slm_session');location.reload()}
function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}boot();
</script></body></html>
