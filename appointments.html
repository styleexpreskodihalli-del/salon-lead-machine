<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appointments · Salon Lead Machine</title><style>:root{--g:#164b37;--bg:#f4f7f4;--line:#dfe6e0;--muted:#68756d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:#17211b}.wrap{max-width:1100px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-weight:950;color:var(--g);font-size:20px}.sub{color:var(--muted);font-size:13px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--g);color:#fff}.light{background:#fff;border:1px solid var(--line);color:var(--g)}.login{max-width:520px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;text-align:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.stat b{display:block;font-size:30px;color:var(--g)}.stat span{font-size:12px;color:var(--muted);font-weight:800}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;font:inherit}.toolbar input{flex:1;min-width:190px}.list{display:grid;gap:12px}.appt{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:14px;align-items:center}.name{font-weight:950;font-size:17px}.muted{color:var(--muted);font-size:13px;line-height:1.45}.badge{display:inline-block;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900;background:#edf6ef;color:var(--g)}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{text-align:center;padding:45px;color:var(--muted)}.link{color:var(--g);font-weight:900;text-decoration:none}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.appt{grid-template-columns:1fr 1fr}}@media(max-width:520px){.appt{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div id="app"><div class="login">Checking your owner session…</div></div></main><script>
const SUPA='https://dhiimviybpbggvuuzwfh.supabase.co',KEY='sb_publishable_IOXACVkfe217drLmK0UCcA_ADmDLTg7',REDIRECT=location.origin+location.pathname;
const $=id=>document.getElementById(id);let session=null,salon=null,all=[];
function parseSession(){const h=new URLSearchParams(location.hash.replace(/^#/,'&'));const a=h.get('access_token'),r=h.get('refresh_token');if(a){session={access_token:a,refresh_token:r};localStorage.setItem('slm_session',JSON.stringify(session));history.replaceState({},'',location.pathname)}else{try{session=JSON.parse(localStorage.getItem('slm_session')||'null')}catch{session=null}}}
async function api(path,opt={}){return fetch(SUPA+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...(opt.headers||{})}})}
function login(){location.assign(SUPA+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(REDIRECT))}
async function boot(){parseSession();if(!session){document.getElementById('app').innerHTML='<div class="login"><div class="brand">Salon Lead Machine</div><h1>Owner Appointments</h1><p class="muted">Sign in to view and manage appointments for your salon.</p><button class="btn primary" onclick="login()">Continue with Google</button></div>';return}try{const r=await api('/rest/v1/salons?select=id,name,city,whatsapp&limit=1');const rows=await r.json();if(!rows[0])throw Error('No salon is connected to this owner account. Complete Salon Setup first.');salon=rows[0];renderShell();await load()}catch(e){document.getElementById('app').innerHTML='<div class="login"><h2>Owner setup required</h2><p class="muted">'+esc(e.message)+'</p><a class="btn light" href="index.html">Open Salon Setup</a></div>'}}
function renderShell(){document.getElementById('app').innerHTML=`<header class="top"><div><div class="brand">Salon Lead Machine</div><div class="sub">${esc(salon.name)} · ${esc(salon.city||'')}</div></div><div class="actions"><a class="btn light" target="_blank" href="salon.html?salon=${encodeURIComponent(salon.id)}">Open My Salon</a><button class="btn primary" onclick="logout()">Sign out</button></div></header><section class="stats"><div class="stat"><b id="total">0</b><span>TOTAL</span></div><div class="stat"><b id="requested">0</b><span>REQUESTED</span></div><div class="stat"><b id="confirmed">0</b><span>CONFIRMED</span></div><div class="stat"><b id="completed">0</b><span>COMPLETED</span></div></section><div class="toolbar"><input id="search" placeholder="Search customer or service" oninput="draw()"><input id="date" type="date" onchange="draw()"><select id="status" onchange="draw()"><option value="">All statuses</option><option>Requested</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option><option>No Show</option></select><button class="btn light" onclick="load()">Refresh</button></div><section id="list" class="list"></section>`}
async function load(){const r=await api('/rest/v1/appointments?salon_id=eq.'+encodeURIComponent(salon.id)+'&select=id,lead_id,customer_name,customer_phone,service,appointment_date,appointment_time,status,notes,source,created_at&order=appointment_date.asc,appointment_time.asc,created_at.desc');if(!r.ok)throw Error(await r.text());all=await r.json();$('total').textContent=all.length;$('requested').textContent=all.filter(x=>x.status==='Requested').length;$('confirmed').textContent=all.filter(x=>x.status==='Confirmed').length;$('completed').textContent=all.filter(x=>x.status==='Completed').length;draw()}
function draw(){const q=($('search')?.value||'').toLowerCase(),d=$('date')?.value||'',st=$('status')?.value||'';const rows=all.filter(x=>(!q||((x.customer_name||'')+' '+(x.service||'')+' '+(x.customer_phone||'')).toLowerCase().includes(q))&&(!d||x.appointment_date===d)&&(!st||x.status===st));$('list').innerHTML=rows.length?rows.map(x=>`<article class="appt"><div><div class="name">${esc(x.customer_name)}</div><div class="muted">${esc(x.service||'Service not selected')} · ${esc(x.source||'Website')}</div><div class="muted">${esc(x.customer_phone)}</div></div><div><span class="badge">${esc(x.status)}</span><div class="muted" style="margin-top:7px">${esc(x.appointment_date)}${x.appointment_time?' · '+esc(x.appointment_time):''}</div></div><div class="muted">${esc(x.notes||'No notes')}</div><div class="actions"><a class="btn light" href="tel:${esc(x.customer_phone)}">Call</a><a class="btn light" target="_blank" href="https://wa.me/${encodeURIComponent((x.customer_phone||'').replace(/\D/g,''))}">WhatsApp</a><select onchange="setStatus('${x.id}',this.value)"><option value="">Change</option>${['Requested','Confirmed','Completed','Cancelled','No Show'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div></article>`).join(''):'<div class="panel empty">No appointments match your filters.</div>'}
async function setStatus(id,status){if(!status)return;const r=await api('/rest/v1/appointments?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status,updated_at:new Date().toISOString()})});if(!r.ok){alert('Unable to update appointment');return}await load()}
function logout(){localStorage.removeItem('slm_session');location.reload()}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}boot();
</script></body></html>
