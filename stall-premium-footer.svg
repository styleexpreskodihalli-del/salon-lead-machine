<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">STall — That's All</title><desc id="desc">Luxury black and gold STall logo with shield monogram and That's All tagline.</desc><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1a8"/><stop offset=".28" stop-color="#f4c44f"/><stop offset=".62" stop-color="#b87912"/><stop offset="1" stop-color="#ffe58a"/></linearGradient><linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24272b"/><stop offset="1" stop-color="#050608"/></linearGradient></defs><g transform="translate(20 10)"><path d="M150 8 L270 55 L260 164 Q246 235 150 276 Q54 235 40 164 L30 55 Z" fill="url(#shield)" stroke="url(#gold)" stroke-width="10"/><path d="M150 22 L254 62 L245 158 Q232 218 150 256 Q68 218 55 158 L46 62 Z" fill="none" stroke="#f6cf67" stroke-opacity=".42" stroke-width="2"/><text x="150" y="178" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="150" font-weight="700" font-style="italic" fill="url(#gold)">S</text><path d="M122 92 H224 L204 114 H181 V190 H151 V114 H122 Z" fill="url(#gold)"/><path d="M150 205 l6 12 13 2-10 9 3 13-12-7-12 7 3-13-10-9 13-2z" fill="url(#gold)"/><g transform="translate(270 92)"><text x="0" y="120" font-family="Arial,Helvetica,sans-serif" font-size="128" font-weight="900" letter-spacing="-8" fill="#f5f5f7">all</text><rect x="82" y="10" width="18" height="110" rx="3" fill="url(#gold)"/><rect x="108" y="-8" width="18" height="128" rx="3" fill="url(#gold)"/><rect x="134" y="-24" width="18" height="136" rx="3" fill="url(#gold)"/></g><g transform="translate(280 248)"><path d="M0 0 H72" stroke="#c38b27" stroke-width="3"/><text x="88" y="8" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" letter-spacing="8" fill="#f5f5f7">THAT’S ALL</text><path d="M290 0 H362" stroke="#c38b27" stroke-width="3"/></g></g></svg>