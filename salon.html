<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salon · Book Online</title><style>
:root{--accent:#c79b52;--accent2:#f1d38a;--bg:#0b0b0c;--surface:#141416;--card:#18181b;--text:#fff;--muted:#c4c4c8;--line:#2c2c30}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;padding-bottom:80px}.wrap{max-width:1160px;margin:auto;padding:18px}.brand{display:flex;justify-content:space-between;align-items:center;padding:8px 0 18px}.brand img{width:170px;height:56px;object-fit:contain}.brand span{font-size:10px;letter-spacing:.2em;color:#aaa;font-weight:900}.hero{position:relative;overflow:hidden;border-radius:30px;min-height:460px;display:flex;align-items:flex-end;background:#171719}.heroBg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.72}.heroBg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.88),rgba(0,0,0,.35),rgba(0,0,0,.18))}.heroContent{position:relative;z-index:2;padding:42px;max-width:760px}.pill{display:inline-block;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);font-size:11px;font-weight:900;letter-spacing:.08em}.hero h1{font-size:clamp(42px,7vw,78px);line-height:.94;margin:17px 0 12px}.hero p{font-size:18px;line-height:1.55;color:#eee;max-width:650px}.rating{font-weight:900;margin:16px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 19px;border-radius:13px;text-decoration:none;font-weight:900;border:1px solid transparent}.primary{background:var(--accent);color:#111}.secondary{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff}.section{margin-top:26px}.section h2{font-size:26px;margin:0 0 13px}.photos{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:170px 170px;gap:10px}.photo{background:#202024;border-radius:18px;overflow:hidden}.photo:first-child{grid-row:1/3}.photo img{width:100%;height:100%;object-fit:cover;display:block}.placeholder{height:100%;display:grid;place-items:center;color:#777;font-weight:900;font-size:13px;background:linear-gradient(135deg,#202024,#101012)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:19px}.card h3{margin:0 0 7px}.muted{color:var(--muted);line-height:1.5}.price{color:var(--accent2);font-weight:900;margin-top:10px}.offer{border-color:rgba(199,155,82,.35);background:linear-gradient(135deg,#211c14,#171719)}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(12,12,14,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px;display:flex;justify-content:center;gap:10px}.bottom a{flex:1;max-width:320px}.error{padding:50px;text-align:center}.ownerPreview{position:sticky;top:0;z-index:50;background:#171719;padding:9px;text-align:center;font-size:12px}.ownerPreview a{color:#fff;margin-left:12px}@media(max-width:700px){.hero{min-height:500px}.heroContent{padding:28px 22px}.photos{grid-template-columns:1fr 1fr;grid-template-rows:180px 180px}.photo:first-child{grid-column:1/3;grid-row:auto}.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.brand span{display:none}.photos{grid-template-columns:1fr 1fr;grid-template-rows:150px 150px}.hero h1{font-size:45px}.grid{grid-template-columns:1fr}.heroContent{padding:24px 19px}}
</style></head><body><div id="ownerPreview" class="ownerPreview" style="display:none">👀 Live Preview <a href="salon-operations.html">Back to Operations</a></div><header class="wrap brand"><img src="stall-approved-light.svg" alt="STall"><span>DISCOVER • CONNECT • GROW</span></header><main class="wrap"><div id="app"><div class="error">Loading salon…</div></div></main><script>
const SUPA='https://dhiimviybpbggvuuzwfh.supabase.co',KEY='sb_publishable_IOXACVkfe217drLmK0UCcA_ADmDLTg7';const q=new URLSearchParams(location.search),salonId=q.get('salon'),source=q.get('source')||'Website',preview=q.get('preview')==='1',overrideTheme=q.get('theme'),overridePhotos=q.get('previewPhotos');const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function booking(){return 'booking.html?salon='+encodeURIComponent(salonId)+'&source='+encodeURIComponent(source)}
const themes={elegant_dark:{accent:'#c79b52',accent2:'#f1d38a',bg:'#0b0b0c',surface:'#141416',text:'#fff',muted:'#c4c4c8',line:'#2c2c30'},fresh_green:{accent:'#16834d',accent2:'#0f6d40',bg:'#f5faf7',surface:'#fff',text:'#17211b',muted:'#5e6d64',line:'#dbe8df'},glamour_purple:{accent:'#d43f91',accent2:'#b62f78',bg:'#fff5fb',surface:'#fff',text:'#281323',muted:'#7d6474',line:'#efd6e4'}};
function applyTheme(t){const x=themes[t]||themes.elegant_dark;for(const k of ['accent','accent2','bg','surface','text','muted','line'])document.documentElement.style.setProperty('--'+k,x[k]);document.body.style.color=x.text}
function photoHtml(url,i,name){return `<div class="photo">${url?`<img src="${esc(url)}" alt="${esc(name)} salon photo ${i+1}" loading="lazy">`:`<div class="placeholder">SALON PHOTO ${i+1}</div>`}</div>`}
async function load(){if(preview)document.getElementById('ownerPreview').style.display='block';if(!salonId){app.innerHTML='<div class="error"><h2>Salon link is incomplete</h2><p class="muted">Open this page from STall Command Centre → Manage Salon.</p></div>';return}try{const r=await fetch(SUPA+'/functions/v1/public-salon?id='+encodeURIComponent(salonId),{headers:{apikey:KEY}});const d=await r.json();if(!r.ok)throw Error(d.error||'Salon not found');const s=d.salon,services=d.services||[],offers=d.offers||[];let theme=overrideTheme||s.website_theme||'elegant_dark';if(!themes[theme])theme='elegant_dark';applyTheme(theme);let photos=Array.isArray(s.website_photos)?s.website_photos.slice(0,4):[];if(overridePhotos){try{const p=JSON.parse(overridePhotos);if(Array.isArray(p))photos=p.slice(0,4)}catch(_){}}const wa=(s.whatsapp||'').replace(/\D/g,'');const waLink=wa?'https://wa.me/'+wa+'?text='+encodeURIComponent('Hi '+s.name+', I would like to book an appointment.'):'';document.title=s.name+' · Book Online';app.innerHTML=`<section class="hero"><div class="heroBg" style="${photos[0]?`background-image:url('${esc(photos[0])}')`:''}"></div><div class="heroContent"><span class="pill">ONLINE · ${esc(s.city||'')}</span><h1>${esc(s.name)}</h1><p>${esc(s.tagline||'Professional salon services with easy online booking.')}</p><div class="rating">★ ${esc(s.rating||'4.8')} · Easy online booking</div><div class="actions"><a class="btn primary" href="${booking()}">Book Appointment</a>${waLink?`<a class="btn secondary" target="_blank" rel="noopener" href="${waLink}">WhatsApp</a>`:''}</div></div></section><section class="section"><h2>Our Salon</h2><div class="photos">${[0,1,2,3].map((_,i)=>photoHtml(photos[i],i,s.name)).join('')}</div></section><section class="section"><h2>Our Services</h2><div class="grid">${services.length?services.map(x=>`<article class="card"><h3>${esc(x.name)}</h3><p class="muted">${esc(x.description||'Professional service tailored to you.')}</p>${x.price!=null?`<div class="price">₹${Number(x.price).toLocaleString('en-IN')}</div>`:''}</article>`).join(''):'<div class="card"><p class="muted">Services will be added by the salon.</p></div>'}</div></section><section class="section"><h2>Offers</h2><div class="grid">${offers.length?offers.map(x=>`<article class="card offer"><h3>${esc(x.title)}</h3><p class="muted">${esc(x.description||'Limited-time salon offer.')}</p></article>`).join(''):'<div class="card"><p class="muted">No active offers right now.</p></div>'}</div></section><section class="section"><div class="card"><h2>Ready to book?</h2><p class="muted">Choose your service and preferred date. The salon receives your request instantly.</p><a class="btn primary" href="${booking()}">Request an Appointment</a></div></section>`}catch(e){app.innerHTML='<div class="error"><h2>Unable to load salon</h2><p class="muted">'+esc(e.message)+'</p></div>'}}load();</script></body></html>
