<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salon · Salon Lead Machine</title><style>:root{--g:#164b37;--g2:#28654b;--bg:#f5f7f4;--line:#dfe6e0;--muted:#65736b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,sans-serif;color:#17211b}.wrap{max-width:1100px;margin:auto;padding:18px 16px 80px}.hero{background:linear-gradient(135deg,#103a2b,#28654b);color:#fff;border-radius:28px;padding:38px 30px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}.pill{display:inline-block;background:#dce9df;color:var(--g);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:900}.hero h1{font-size:clamp(36px,6vw,66px);line-height:.98;margin:16px 0 10px}.hero p{color:#dce9df;max-width:650px;font-size:17px;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;justify-content:center;align-items:center;text-decoration:none;border:0;border-radius:13px;padding:14px 18px;font-weight:900;cursor:pointer}.primary{background:#fff;color:var(--g)}.secondary{background:#dce9df;color:var(--g)}.section{margin-top:18px}.section h2{margin:0 0 12px;font-size:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.price{font-weight:900;color:var(--g);margin-top:10px}.muted{color:var(--muted);line-height:1.5}.offer{background:#edf6ef}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;justify-content:center}.bottom a{flex:1;max-width:300px}.error{padding:40px;text-align:center}.stars{font-weight:900;font-size:18px}@media(max-width:750px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero{padding:28px 22px}}.ownerPreview{position:sticky;top:0;z-index:50;background:#17211b;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:800}.ownerPreview span{opacity:.9}.ownerPreview a{color:#fff;text-decoration:none;background:#28654b;padding:7px 11px;border-radius:9px}.ownerPreview a.secondaryPreview{background:#dce9df;color:#164b37}@media(max-width:520px){.ownerPreview{font-size:11px}}</style></head>
<body><div id="ownerPreview" class="ownerPreview" style="display:none"><span>👀 Preview Mode · This is your customer website</span><a href="index.html">← Back to Dashboard</a><a class="secondaryPreview" href="index.html?tab=catalog">Edit Website</a></div><main class="wrap"><div id="app"><div class="error">Loading salon…</div></div></main><script>
const SUPA='https://dhiimviybpbggvuuzwfh.supabase.co',KEY='sb_publishable_IOXACVkfe217drLmK0UCcA_ADmDLTg7';
const q=new URLSearchParams(location.search),salonId=q.get('salon'),source=q.get('source')||'Website',preview=q.get('preview')==='1';
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function booking(){return 'booking.html?salon='+encodeURIComponent(salonId)+'&source='+encodeURIComponent(source)}
async function load(){if(preview){const bar=document.getElementById('ownerPreview');if(bar)bar.style.display='flex'}if(!salonId){document.getElementById('app').innerHTML='<div class="error"><h2>Salon link is incomplete</h2><p class="muted">Ask the salon for its official Salon Lead Machine link.</p></div>';return}try{const r=await fetch(SUPA+'/functions/v1/public-salon?id='+encodeURIComponent(salonId),{headers:{apikey:KEY}});const d=await r.json();if(!r.ok)throw Error(d.error||'Salon not found');const s=d.salon,services=d.services||[],offers=d.offers||[];const wa=(s.whatsapp||'').replace(/\D/g,'');const waLink=wa?'https://wa.me/'+wa+'?text='+encodeURIComponent('Hi '+s.name+', I would like to book an appointment. '+location.origin+location.pathname.replace('salon.html','')+booking()):'';document.title=s.name+' · Book Online';document.getElementById('app').innerHTML=`<section class="hero"><div><span class="pill">SALON LEAD MACHINE · ONLINE</span><h1>${esc(s.name)}</h1><p>${esc(s.tagline||'Professional salon services with easy online booking.')}</p><div class="stars">★ ${esc(s.rating||'4.8')} · ${esc(s.city||'')}${s.city?' · ':''}Easy online booking</div></div><div class="actions"><a class="btn primary" href="${booking()}">Book Appointment</a>${waLink?`<a class="btn secondary" href="${waLink}" target="_blank" rel="noopener">WhatsApp</a>`:''}</div></section><section class="section"><h2>Our Services</h2><div class="grid">${services.length?services.map(x=>`<article class="card"><h3>${esc(x.name)}</h3><p class="muted">${esc(x.description||'Professional service tailored to you.')}</p>${x.price!=null?`<div class="price">₹${Number(x.price).toLocaleString('en-IN')}</div>`:''}</article>`).join(''):'<div class="card"><p class="muted">Services will be added by the salon.</p></div>'}</div></section><section class="section"><h2>Offers</h2><div class="grid">${offers.length?offers.map(x=>`<article class="card offer"><h3>${esc(x.title)}</h3><p class="muted">${esc(x.description||'Limited-time salon offer.')}</p></article>`).join(''):'<div class="card"><p class="muted">No active offers right now.</p></div>'}</div></section><section class="section"><div class="card"><h2>Ready to book?</h2><p class="muted">Choose your service and preferred date. The salon receives your request instantly and can confirm it from its owner dashboard.</p><a class="btn" style="background:var(--g);color:#fff" href="${booking()}">Request an Appointment</a></div></section>`}catch(e){document.getElementById('app').innerHTML='<div class="error"><h2>Unable to load salon</h2><p class="muted">'+esc(e.message)+'</p></div>'}}
load();
</script></body></html>
