name: Add Google Ads conversion event

on:
  push:
    paths:
      - '.github/workflows/install-google-ads-conversion.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add conversion event before WhatsApp redirect
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('whatsapp-score.html')
          s = p.read_text(encoding='utf-8')
          marker = 'autoSendAuditToWhatsApp(d);'
          snippet = """gtag('event', 'conversion', {\n  'send_to': 'AW-18444075747/9HxaCIOQ6fMcEOOF6dpE'\n});\n"""
          if "AW-18444075747/9HxaCIOQ6fMcEOOF6dpE" not in s:
              if marker not in s:
                  raise SystemExit('Conversion insertion marker not found')
              s = s.replace(marker, snippet + marker, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Conversion event already present')
          PY
      - name: Commit conversion event
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whatsapp-score.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Wire Google Ads Digital Score conversion event'
            git push
          fi
