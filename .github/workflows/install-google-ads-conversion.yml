name: Add Google Ads conversion event

on:
  push:
    paths:
      - '.github/workflows/install-google-ads-conversion.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add conversion event after successful score generation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('whatsapp-score.html')
          s = p.read_text(encoding='utf-8')
          tag = "AW-18444075747/9HxaCIOQ6fMcEOOF6dpE"
          snippet = "gtag('event', 'conversion', { 'send_to': 'AW-18444075747/9HxaCIOQ6fMcEOOF6dpE' });\n"
          if tag in s:
              print('Conversion event already present')
          else:
              markers = [
                  'render(d);',
                  "$('status').textContent='✓ Correct nearby Google profile fetched and scored.';",
                  'render(data);'
              ]
              marker = next((m for m in markers if m in s), None)
              if not marker:
                  print('Available render/status markers:')
                  for token in ['render(', 'Correct nearby', 'scored', 'WhatsApp']:
                      print(token, s.find(token))
                  raise SystemExit('Conversion insertion marker not found')
              s = s.replace(marker, marker + snippet, 1)
              p.write_text(s, encoding='utf-8')
              print('Inserted conversion event after:', marker)
          PY
      - name: Commit conversion event
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whatsapp-score.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Wire Google Ads Digital Score conversion event'
            git push
          fi
