name: Add Google Ads conversion event

on: push

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add conversion event after successful score generation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('whatsapp-score.html')
          s = p.read_text(encoding='utf-8')
          tag = 'AW-18444075747/9HxaCIOQ6fMcEOOF6dpE'
          snippet = "gtag('event', 'conversion', { 'send_to': 'AW-18444075747/9HxaCIOQ6fMcEOOF6dpE' });"
          if tag in s:
              print('Conversion event already present')
          else:
              marker = 'autoSendAuditToWhatsApp(d)'
              if marker not in s:
                  raise SystemExit('Successful-score marker not found')
              s = s.replace(marker, snippet + marker, 1)
              p.write_text(s, encoding='utf-8')
              print('Inserted conversion event before WhatsApp redirect')
          PY
      - name: Commit conversion event
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whatsapp-score.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Wire Google Ads Digital Score conversion event'
            git push
          fi
