name: Personalize Salon Audit Page

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/personalize-audit-page.yml'

permissions:
  contents: write

jobs:
  personalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix personalized audit JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('whatsapp-score.html')
          s = p.read_text(encoding='utf-8')
          marker = 'salon_prospect_sep_2026'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('Personalized audit script marker not found.')

          start = s.rfind('<script>', 0, pos)
          end = s.find('</script>', pos)
          if start < 0 or end < 0:
              raise SystemExit('Personalized audit script boundaries not found.')

          block = s[start:end + len('</script>')]
          # The original workflow used a raw Python string and wrote literal \\n          # sequences into the HTML. Convert only this personalized script block
          # back to normal JavaScript source with real line breaks.
          fixed = block.replace('\\\\n', '\\n')
          fixed = fixed.replace('<script>\\n', '<script>\n')
          fixed = fixed.replace('\\n</script>', '\n</script>')

          s = s[:start] + fixed + s[end + len('</script>'):]
          p.write_text(s, encoding='utf-8')
          print('Personalized audit JavaScript normalized.')
          PY

      - name: Validate personalized JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('whatsapp-score.html').read_text(encoding='utf-8')
          opening = re.compile(r'<script(?:\s[^>]*)?>', re.I)
          closing = re.compile(r'</script\s*>', re.I)
          start = opening.search(s)
          blocks=[]
          pos=0
          while True:
              a=opening.search(s,pos)
              if not a: break
              b=closing.search(s,a.end())
              if not b: raise SystemExit('Unterminated script')
              blocks.append(s[a.end():b.start()])
              pos=b.end()
          target=[x for x in blocks if 'salon_prospect_sep_2026' in x]
          if not target: raise SystemExit('Target personalized script missing')
          if '\\n(function' in target[0]: raise SystemExit('Literal escaped newlines remain')
          Path('/tmp/personalized.js').write_text(target[0],encoding='utf-8')
          PY
          node --check /tmp/personalized.js

      - name: Commit personalized audit fix
        run: |
          git config user.name 'STall Automation'
          git config user.email 'actions@github.com'
          git add whatsapp-score.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix personalized audit JavaScript'
          git push
