name: Customer Website Link

on:
  push:
    paths:
      - '.github/workflows/customer-website-link.yml'

permissions:
  contents: write

jobs:
  update-customer-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Customer Website navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('<button data-tab="demo" type="button">Customer Website</button>', '<button id="customerWebsiteBtn" type="button">Customer Website ↗</button>', 1)
          s = s.replace('<button type="button" onclick="openCustomerWebsite()">Customer Website ↗</button>', '<button id="customerWebsiteBtn" type="button">Customer Website ↗</button>', 1)
          s = s.replace('<button type="button" onclick="switchTab(\'demo\')">Open Customer Website</button>', '<button id="openCustomerWebsiteBtn" type="button">Open Customer Website ↗</button>', 1)
          s = s.replace('<button type="button" onclick="openCustomerWebsite()">Open Customer Website ↗</button>', '<button id="openCustomerWebsiteBtn" type="button">Open Customer Website ↗</button>', 1)

          fn = "function openCustomerWebsite(){if(typeof salon==='undefined'||!salon||!salon.id){alert('Please complete Salon Setup first.');return false;}var u='salon.html?salon='+encodeURIComponent(salon.id)+'&preview=1';window.open(u,'_blank');return false;}"
          if 'function openCustomerWebsite()' not in s:
              s = s.replace('</script>', fn + "\ndocument.addEventListener('click',function(e){var b=e.target.closest('#customerWebsiteBtn,#openCustomerWebsiteBtn');if(b){e.preventDefault();openCustomerWebsite();}});\n</script>", 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Fix Customer Website click handler'
          git push
