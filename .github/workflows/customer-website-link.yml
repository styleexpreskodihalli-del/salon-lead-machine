name: Customer Website Link

on:
  push:
    paths:
      - '.github/workflows/customer-website-link.yml'

permissions:
  contents: write

jobs:
  update-customer-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Customer Website navigation and preview mode
        run: |
          python - <<'PY'
          from pathlib import Path

          # Owner dashboard: Customer Website opens the real public salon page in a new tab.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '<button data-tab="demo" type="button">Customer Website</button>'
          new = '<button type="button" onclick="openCustomerWebsite()">Customer Website ↗</button>'
          if old in s:
              s = s.replace(old, new, 1)

          old_quick = '<button type="button" onclick="switchTab(\'demo\')">Open Customer Website</button>'
          new_quick = '<button type="button" onclick="openCustomerWebsite()">Open Customer Website ↗</button>'
          if old_quick in s:
              s = s.replace(old_quick, new_quick, 1)

          marker = "function switchTab(tab){"
          fn = "function openCustomerWebsite(){if(!salon?.id){alert('Salon is not configured yet.');return}window.open('salon.html?salon='+encodeURIComponent(salon.id)+'&preview=1','_blank','noopener');}\n"
          if 'function openCustomerWebsite()' not in s and marker in s:
              s = s.replace(marker, fn + marker, 1)

          p.write_text(s, encoding='utf-8')

          # Public salon page: owner preview mode gets a small control bar.
          p = Path('salon.html')
          s = p.read_text(encoding='utf-8')

          css_marker = '</style></head>'
          css = '.ownerPreview{position:sticky;top:0;z-index:50;background:#17211b;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:800}.ownerPreview span{opacity:.9}.ownerPreview a{color:#fff;text-decoration:none;background:#28654b;padding:7px 11px;border-radius:9px}.ownerPreview a.secondaryPreview{background:#dce9df;color:#164b37}@media(max-width:520px){.ownerPreview{font-size:11px}}'
          if '.ownerPreview{' not in s and css_marker in s:
              s = s.replace(css_marker, css + '</style></head>', 1)

          old_const = "const q=new URLSearchParams(location.search),salonId=q.get('salon'),source=q.get('source')||'Website';"
          new_const = "const q=new URLSearchParams(location.search),salonId=q.get('salon'),source=q.get('source')||'Website',preview=q.get('preview')==='1';"
          if old_const in s:
              s = s.replace(old_const, new_const, 1)

          old_body = '<body><main class="wrap">'
          new_body = '<body><div id="ownerPreview" class="ownerPreview" style="display:none"><span>👀 Preview Mode · This is your customer website</span><a href="index.html">← Back to Dashboard</a><a class="secondaryPreview" href="index.html?tab=catalog">Edit Website</a></div><main class="wrap">'
          if old_body in s:
              s = s.replace(old_body, new_body, 1)

          old_load = 'async function load(){if(!salonId){'
          new_load = "async function load(){if(preview){const bar=document.getElementById('ownerPreview');if(bar)bar.style.display='flex'}if(!salonId){"
          if old_load in s:
              s = s.replace(old_load, new_load, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html salon.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Add owner preview mode to Customer Website'
          git push
