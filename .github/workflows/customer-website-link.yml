name: Customer Website Link

on:
  push:
    paths:
      - '.github/workflows/customer-website-link.yml'

permissions:
  contents: write

jobs:
  repair-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair application navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Normalize the two Customer Website controls without changing any existing dashboard logic.
          replacements = {
              '<button data-tab="demo" type="button">Customer Website</button>': '<button id="customerWebsiteBtn" type="button">Customer Website ↗</button>',
              '<button type="button" onclick="openCustomerWebsite()">Customer Website ↗</button>': '<button id="customerWebsiteBtn" type="button">Customer Website ↗</button>',
              '<button type="button" onclick="switchTab(\'demo\')">Open Customer Website</button>': '<button id="openCustomerWebsiteBtn" type="button">Open Customer Website ↗</button>',
              '<button type="button" onclick="openCustomerWebsite()">Open Customer Website ↗</button>': '<button id="openCustomerWebsiteBtn" type="button">Open Customer Website ↗</button>'
          }
          for old, new in replacements.items():
              s = s.replace(old, new, 1)

          # Add a capture-phase navigation layer. It does not replace existing application functions.
          fix = r'''<script>
          (function(){
            function openCustomerWebsiteSafe(){
              try{
                if(typeof salon==='undefined'||!salon||!salon.id){alert('Please complete Salon Setup first.');return;}
                var url='salon.html?salon='+encodeURIComponent(salon.id)+'&preview=1';
                var w=window.open(url,'_blank');
                if(!w){window.location.href=url;}
              }catch(e){alert('Unable to open Customer Website: '+(e.message||e));}
            }
            document.addEventListener('click',function(e){
              var website=e.target.closest('#customerWebsiteBtn,#openCustomerWebsiteBtn');
              if(website){e.preventDefault();e.stopPropagation();openCustomerWebsiteSafe();return;}
              var nav=e.target.closest('.nav button[data-tab]');
              if(nav){e.preventDefault();e.stopPropagation();var tab=nav.getAttribute('data-tab');if(tab&&typeof switchTab==='function'){switchTab(tab);}return;}
            },true);
            window.openCustomerWebsite=openCustomerWebsiteSafe;
          })();
          </script>'''
          if 'openCustomerWebsiteSafe' not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('index.html has no </body> marker; refusing to modify it')
              s = s.replace(marker, fix + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate HTML markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = ['id="customerWebsiteBtn"', 'openCustomerWebsiteSafe', "location.href='bookings.html'", 'data-tab="catalog"', 'data-tab="setup"', 'data-tab="settings"']
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing required navigation marker(s): ' + ', '.join(missing))
          print('Navigation markers validated:', ', '.join(required))
          PY

      - name: Commit repaired application
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Fix application navigation without changing existing features'
          git push
