name: Enable Automatic WhatsApp Audit Delivery
on:
  push:
    paths:
      - '.github/workflows/auto-whatsapp-audit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch audit auto delivery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('whatsapp-score.html')
          s=p.read_text(encoding='utf-8')
          if 'function autoSendAuditToWhatsApp' in s:
              print('Already patched')
              raise SystemExit(0)
          marker="function render(d){data=d;"
          inject="""function autoSendAuditToWhatsApp(d){\n  const qp=new URLSearchParams(location.search);\n  const raw=qp.get('phone')||qp.get('whatsapp')||'';\n  const phone=raw.replace(/\\D/g,'');\n  if(phone.length<10)return false;\n  const b=d.place,a=d.audit;\n  const text=`Hi! Here is your FREE STall Salon Digital Score\\n\\nSalon: ${b.name||'Salon'}\\nGoogle Score: ${a.score}/100\\nGoogle Rating: ${b.rating||'N/A'} (${b.reviews||0} reviews)\\nWebsite: ${b.website?'Yes':'No'}\\nBiggest opportunity: ${a.gap}\\n\\nSTall — Salon Digital Growth\\nhttps://free-digital-score.stallwale.in/whatsapp-score.html`;\n  const url='https://wa.me/'+phone+'?text='+encodeURIComponent(text);\n  setTimeout(()=>{ location.href=url; },700);\n  return true;\n}\n\n"""
          if marker not in s: raise SystemExit('render marker not found')
          s=s.replace(marker,inject+marker,1)
          old="render(d);$('status').textContent='✓ Correct nearby Google profile fetched and scored.'"
          new="render(d);$('status').textContent='✓ Correct nearby Google profile fetched and scored.';autoSendAuditToWhatsApp(d)"
          if old not in s: raise SystemExit('run success marker not found')
          s=s.replace(old,new,1)
          # Pre-fill and hide the manual WhatsApp field when a prospect phone is supplied in the personalized URL.
          old2="$('profile').addEventListener('input',()=>{clearTimeout(timer);"
          inject2="""const auditParams=new URLSearchParams(location.search);\nconst prospectPhone=(auditParams.get('phone')||auditParams.get('whatsapp')||'').replace(/\\D/g,'');\nif(prospectPhone.length>=10){\n  const ph=$('phone');\n  if(ph){ph.value=prospectPhone;ph.closest('.wa')?.querySelector('button')?.setAttribute('data-auto','1');}\n}\n"""
          if old2 not in s: raise SystemExit('listener marker not found')
          s=s.replace(old2,inject2+old2,1)
          p.write_text(s,encoding='utf-8')
          print('Automatic WhatsApp audit delivery enabled. It opens WhatsApp with the scored result for the phone supplied in ?phone= or ?whatsapp=.')
          PY
      - name: Commit patch
        run: |
          git config user.name 'STall Automation'
          git config user.email 'actions@github.com'
          git add whatsapp-score.html
          git diff --cached --quiet && exit 0
          git commit -m 'Auto-send salon audit score to WhatsApp'
          git push
