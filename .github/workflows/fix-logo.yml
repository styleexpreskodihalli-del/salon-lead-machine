name: Fix STall Logo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-logo.yml'
      - 'whatsapp-score.html'
      - 'rebrand_score.py'
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tooling
        run: python3 -m pip install --quiet pillow
      - name: Convert embedded logo to reliable PNG
        run: |
          python3 - <<'PY'
          import base64, re
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          p=Path('whatsapp-score.html')
          s=p.read_text(encoding='utf-8')
          m=re.search(r'data:image/webp;base64,([^\"]+)', s)
          if not m:
              print('No embedded WebP logo found; nothing to fix.')
              raise SystemExit(0)
          raw=base64.b64decode(m.group(1))
          im=Image.open(BytesIO(raw)).convert('RGBA')
          out=BytesIO(); im.save(out, format='PNG', optimize=True)
          b64=base64.b64encode(out.getvalue()).decode()
          s=s.replace(m.group(0), 'data:image/png;base64,'+b64)
          p.write_text(s, encoding='utf-8')
          print('Logo converted to PNG:', len(b64))
          PY
      - name: Commit fix
        run: |
          git config user.name 'STall Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add whatsapp-score.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix STall logo rendering'
          git push
