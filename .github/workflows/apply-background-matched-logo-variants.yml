name: Apply STall Same Master Logo
on:
  push:
    paths:
      - '.github/workflows/apply-background-matched-logo-variants.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply same approved master logo to non-frozen pages
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = ['audit.html','google-reviews.html','whatsapp-ad.html','salon.html','sales.html']
          old_refs = [
              'src="stall-premium-top.svg"',
              'src="stall-approved-logo.webp"',
          ]
          new_ref = 'src="stall-exact-approved.svg"'
          for name in targets:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              old = s
              for ref in old_refs:
                  s = s.replace(ref, new_ref)
              if s == old:
                  raise SystemExit(f'No logo reference found to replace in {name}')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit exact master logo application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.html google-reviews.html whatsapp-ad.html salon.html sales.html
          git commit -m "Use same approved STall master logo on pages"
          git push
