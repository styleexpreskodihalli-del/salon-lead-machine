name: Standardize Digital Score Logo
on:
  push:
    branches: [main]
    paths:
      - 'digital-score-logo-trigger.txt'
      - 'stall-approved-logo.webp'
      - '.github/workflows/standardize-digital-score-logo.yml'
permissions:
  contents: write
jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply master logo safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          LOGO='stall-approved-logo.webp'
          CSS='''
          /* Shared STall Digital Score branding */
          .stall-brandbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 0 18px}
          .stall-brandbar img{width:150px;height:82px;object-fit:contain;display:block}
          .stall-brandbar .stall-nav{font-size:10px;font-weight:900;letter-spacing:.2em;color:#777;text-transform:uppercase}
          .stall-ds-footer{margin-top:36px;padding:26px 0 18px;border-top:1px solid rgba(199,155,82,.28);display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;gap:25px}
          .stall-ds-footer img{width:150px;height:82px;object-fit:contain;display:block}
          .stall-ds-footer .mid{font-size:10px;font-weight:900;letter-spacing:.18em;color:#333}
          .stall-ds-footer .sub{margin-top:7px;font-size:11px;line-height:1.5;color:#777;letter-spacing:0}
          .stall-ds-footer .right{text-align:right;font-size:9px;line-height:1.7;letter-spacing:.12em;color:#9a721e;font-weight:900}
          .stall-ds-footer .copy{margin-top:6px;color:#888;letter-spacing:.04em;font-weight:500}
          @media(max-width:700px){.stall-brandbar{padding:8px 0 14px}.stall-brandbar img{width:125px;height:68px}.stall-brandbar .stall-nav{display:none}.stall-ds-footer{display:flex;flex-direction:column;text-align:center;gap:14px}.stall-ds-footer .right{text-align:center}.stall-ds-footer img{width:140px;height:76px}}
          '''
          def add(path,kind):
              p=Path(path);s=p.read_text(encoding='utf-8')
              if 'Shared STall Digital Score branding' not in s:s=s.replace('</style>',CSS+'\n</style>',1)
              if kind=='audit':
                  header='<header class="stall-brandbar"><img alt="STall logo" src="'+LOGO+'"><div class="stall-nav">DISCOVER <span>•</span> CONNECT <span>•</span> GROW</div></header>'
                  old='<div class="brand">Salon <span>Lead Machine</span></div>'
                  if '<header class="stall-brandbar">' not in s:s=s.replace(old,header,1) if old in s else s.replace('<div class="wrap">','<div class="wrap">'+header,1)
              elif kind=='reviews':
                  old='<div class="logo">Salon <span>Lead Machine</span></div>'
                  new='<div class="logo"><img alt="STall logo" src="'+LOGO+'"></div>'
                  if 'src="'+LOGO+'"' not in s:s=s.replace(old,new,1)
                  if '.logo img{' not in s:s=s.replace('.logo{font-weight:900;font-size:21px}', '.logo{font-weight:900;font-size:21px;display:flex;align-items:center}.logo img{width:150px;height:82px;object-fit:contain;display:block}',1)
              elif kind=='ad':
                  old='<header class="top"><div class="logo">Salon <span>Lead Machine</span></div><div class="pill">FREE SALON DIGITAL AUDIT</div></header>'
                  new='<header class="top"><div class="logo"><img alt="STall logo" src="'+LOGO+'"></div><div class="pill">FREE SALON DIGITAL AUDIT</div></header>'
                  if 'src="'+LOGO+'"' not in s:s=s.replace(old,new,1)
                  if '.logo img{' not in s:s=s.replace('.logo{font-weight:900;font-size:21px}', '.logo{font-weight:900;font-size:21px;display:flex;align-items:center}.logo img{width:150px;height:82px;object-fit:contain;display:block}',1)
              elif kind=='salon':
                  header='<header class="stall-brandbar"><img alt="STall logo" src="'+LOGO+'"><div class="stall-nav">DISCOVER <span>•</span> CONNECT <span>•</span> GROW</div></header>'
                  if '<header class="stall-brandbar">' not in s:s=s.replace('<main class="wrap">',header+'<main class="wrap">',1)
              if 'class="stall-ds-footer"' not in s:
                  footer='<footer class="stall-ds-footer"><div><img alt="STall logo" src="'+LOGO+'"></div><div class="mid">FREE SALON DIGITAL SCORE<div class="sub">For Salon Owners. Built to help you get found, trusted and contacted.</div></div><div class="right">DISCOVER <span>•</span> CONNECT <span>•</span> GROW<div class="copy">© 2026 STall. All rights reserved.</div></div></footer>'
                  s=s.replace('</body>',footer+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          for fn,kind in [('audit.html','audit'),('google-reviews.html','reviews'),('whatsapp-ad.html','ad'),('salon.html','salon')]:add(fn,kind)
          print('Applied master STall logo to Digital Score pages.')
          PY
      - name: Verify before commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for fn in ['audit.html','google-reviews.html','whatsapp-ad.html','salon.html']:
              s=Path(fn).read_text(encoding='utf-8')
              assert s.count('stall-approved-logo.webp') >= 2, fn+' logo missing'
              assert 'class="stall-ds-footer"' in s, fn+' footer missing'
          score=Path('whatsapp-score.html').read_text(encoding='utf-8')
          for x in ['public-salon-audit','sales_leads','918197018680','stall-approved-logo.webp']:
              assert x in score, 'score page missing '+x
          for fn,xs in {'audit.html':['function audit()','sendWhatsApp()'],'google-reviews.html':['/functions/v1/google-reviews','Connect Google Reviews'],'whatsapp-ad.html':['leadForm','918197018680'],'salon.html':['public-salon','booking.html']}.items():
              s=Path(fn).read_text(encoding='utf-8')
              for x in xs:assert x in s,fn+' missing '+x
          print('Verification passed: application logic markers preserved.')
          PY
      - name: Commit page-only changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit.html google-reviews.html whatsapp-ad.html salon.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use master STall logo across Digital Score pages'
          git pull --rebase origin main
          git push origin HEAD:main
