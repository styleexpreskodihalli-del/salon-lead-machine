name: Fix STall Footer Logo
on:
  workflow_run:
    workflows: ["Rebrand Salon Digital Score"]
    types: [completed]
  push:
    paths:
      - 'footer-structure-trigger.txt'
permissions:
  contents: write
jobs:
  fix-footer:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild footer information structure
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('whatsapp-score.html')
          s = p.read_text(encoding='utf-8')
          m = re.search(r'<header class="top">.*?<img class="logo"[^>]*src="([^"]+)"', s, re.S)
          if not m:
              raise SystemExit('Header STall logo source not found')
          logo_src = m.group(1)
          footer = '''<footer class="footer">
            <div class="footer-inner">
              <div class="footer-brand">
                <div class="footer-mark"><img alt="STall logo" src="''' + logo_src + '''"></div>
              </div>
              <div class="footer-copy">
                <div class="footer-tag">FREE SALON DIGITAL SCORE</div>
                <div class="footer-sub">For Salon Owners. Built to help you get found, trusted and contacted.</div>
              </div>
              <div class="footer-links">
                <div class="footer-nav">DISCOVER <span>•</span> CONNECT <span>•</span> GROW</div>
                <div class="footer-copyright">© 2026 STall. All rights reserved.</div>
              </div>
            </div>
          </footer>'''
          s, n = re.subn(r'<footer class="footer">.*?</footer>', footer, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Footer replacement count was {n}')
          css = '''
          /* STall footer information structure */
          .footer{margin:28px -18px -55px;padding:0 7%;background:#0d0e12;color:#fff;border-top:1px solid rgba(217,173,82,.28)}
          .footer-inner{max-width:1120px;margin:auto;padding:32px 0 26px;display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;gap:42px}
          .footer-brand{display:flex;align-items:center;justify-content:flex-start}
          .footer-mark{width:150px;height:101px;display:flex;align-items:center;justify-content:flex-start;flex:0 0 auto}
          .footer-mark img{width:150px;height:101px;object-fit:contain;display:block}
          .footer-copy{text-align:left;max-width:430px}
          .footer-tag{font-size:11px;letter-spacing:.2em;font-weight:900;color:#f4f4f6}
          .footer-sub{margin-top:8px;font-size:11px;line-height:1.55;color:#9699a2;max-width:390px}
          .footer-links{text-align:left;justify-self:end}
          .footer-nav{font-size:10px;letter-spacing:.16em;color:#d9ad52;font-weight:900;white-space:nowrap}
          .footer-nav span{padding:0 7px;color:#555861}
          .footer-copyright{margin-top:11px;font-size:9px;letter-spacing:.04em;color:#6f727c}
          @media(max-width:800px){
            .footer-inner{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 0 24px;gap:16px}
            .footer-brand{justify-content:center}
            .footer-mark,.footer-mark img{width:150px;height:101px}
            .footer-copy{text-align:center;max-width:420px}
            .footer-links{text-align:center;justify-self:auto}
            .footer-nav{white-space:normal}
          }
          '''
          s = s.replace('</style>', css + '</style>', 1)
          p.write_text(s, encoding='utf-8')
          print('Footer rebuilt with balanced left/center/right information structure and copyright.')
          PY
      - name: Commit footer fix
        run: |
          git config user.name 'STall Automation'
          git config user.email 'actions@github.com'
          git add whatsapp-score.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix STall footer information layout'
          git push
