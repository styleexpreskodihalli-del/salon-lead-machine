name: Fix STall Footer Logo
on:
  workflow_run:
    workflows: ["Rebrand Salon Digital Score"]
    types: [completed]
permissions:
  contents: write
jobs:
  fix-footer:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use exact STall logo in footer
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('whatsapp-score.html')
          s = p.read_text(encoding='utf-8')
          m = re.search(r'<header class="top">.*?<img class="logo"[^>]*src="([^"]+)"', s, re.S)
          if not m:
              raise SystemExit('Exact header STall logo source not found')
          logo_src = m.group(1)
          footer_brand = '<div class="footer-brand"><div class="footer-mark"><img alt="STall logo" src="' + logo_src + '"></div></div>'
          s, n = re.subn(r'<div class="footer-brand">.*?</div></div>', footer_brand, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Footer brand replacement count was {n}')
          s = s.replace('.footer-mark{width:46px;height:56px;', '.footer-mark{width:118px;height:72px;')
          s = s.replace('.footer-mark img{width:43px;height:55px;', '.footer-mark img{width:118px;height:72px;')
          p.write_text(s, encoding='utf-8')
          print('Footer now uses the exact same STall logo as the header.')
          PY
      - name: Commit footer fix
        run: |
          git config user.name 'STall Automation'
          git config user.email 'actions@github.com'
          git add whatsapp-score.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix STall footer logo'
          git push
