name: One-time HTML Integrity Repair

on:
  push:
    paths:
      - '.github/workflows/one-time-html-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair index script boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          opens=s.count('<script')
          closes=s.count('</script>')
          if opens == closes:
              print('index.html script tags already balanced')
          elif opens == 2 and closes == 1 and s.count('</body>') == 1:
              s=s.replace('</body>', '</script>\n</body>', 1)
              p.write_text(s, encoding='utf-8')
              print('Repaired missing closing script tag in index.html')
          else:
              raise SystemExit(f'Unexpected script/body structure: opens={opens}, closes={closes}, bodies={s.count("</body>")}')
          PY
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('<script') == s.count('</script>'), 'index.html script tags remain unbalanced'
          assert s.count('<body') == 1 and s.count('</body>') == 1, 'index.html body tags invalid'
          print('index.html integrity check passed')
          PY
      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/one-time-html-repair.yml
          git commit -m 'Repair HTML integrity and remove one-time repair workflow'
          git push
