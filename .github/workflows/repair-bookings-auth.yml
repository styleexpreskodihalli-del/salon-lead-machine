name: Repair Bookings Customer Auth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-bookings-auth.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair bookings authentication
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bookings.html')
          s = p.read_text()

          old = "async function init(){const {data:{session}}=await db.auth.getSession();if(!session)throw new Error('Please sign in with Google from the owner dashboard first.');"
          new = "async function init(){let stored=null;try{stored=JSON.parse(localStorage.getItem('slm_session')||'null')}catch(e){}if(stored?.access_token){try{await db.auth.setSession({access_token:stored.access_token,refresh_token:stored.refresh_token||''})}catch(e){}}const {data:{session}}=await db.auth.getSession();if(!session)throw new Error('Please sign in with Google from the owner dashboard first.');"
          if old in s:
              s = s.replace(old, new, 1)

          old2 = "$('bookingForm').onsubmit=createBooking;\n$('table').addEventListener"
          new2 = "$('bookingForm').onsubmit=createBooking;\ninit().catch(e=>{$('loading').textContent='Unable to load bookings: '+(e.message||'Unknown error');$('loading').style.color='#9b1c1c'});\n$('table').addEventListener"
          if old2 in s and "Unable to load bookings:" not in s:
              s = s.replace(old2, new2, 1)

          p.write_text(s)
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bookings.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Bookings and Customers authentication'
          git push
