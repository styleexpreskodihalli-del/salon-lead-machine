name: Apply automatic salon profile UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip auto-profile]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update salon profile behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_section = re.search(r'<section id="settings" class="panel">.*?</section>\n', s, re.S)
          if not old_section:
              raise SystemExit('settings section not found')
          new_section = '''<section id="settings" class="panel"><div class="card"><div class="sectionHead"><div><h2>Your Business Profile</h2><div class="muted">Business information is automatically populated from your verified Google Business listing.</div></div><span id="profileSourceBadge" class="badge">Google Business</span></div><div id="profileSummary" class="googleBox"><div class="muted">Connect your Google Business listing in Auto Setup to populate this profile automatically.</div></div><div class="formGrid profileEditForm hidden"><div class="field"><label>Salon name</label><input id="salonName" disabled></div><div class="field"><label>City</label><input id="salonCity" disabled></div><div class="field"><label>WhatsApp number</label><input id="salonWhatsapp" disabled></div><div class="field"><label>Google rating</label><input id="salonRating" type="number" step="0.1" min="0" max="5" disabled></div><div class="field full"><label>Tagline</label><input id="salonTagline" disabled></div></div><div class="actions"><button id="editSettingsBtn" class="secondary" type="button">✏️ Edit / Correct Details</button><button id="saveSettingsBtn" class="primary hidden" type="button">Save Corrections</button><button id="cancelSettingsBtn" class="ghost hidden" type="button">Cancel</button><span id="settingsNotice" class="notice">Saved.</span></div></div><div class="section card"><h3>Google reputation</h3><div id="reputationBox" class="googleBox">Connect a Google Business listing in Auto Setup.</div></div></section>\n'''
          s = s[:old_section.start()] + new_section + s[old_section.end():]

          marker = '.googleBox{background:#f8faf8;border:1px solid var(--line);border-radius:16px;padding:16px}'
          if '.profileEditForm' not in s:
              s = s.replace(marker, marker + '.profileEditForm.hidden{display:none}.profileSummaryGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.profileSummaryItem{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.profileSummaryItem strong{display:block;font-size:16px}.profileSummaryItem span{display:block;color:var(--muted);font-size:12px;margin-top:4px}@media(max-width:850px){.profileSummaryGrid{grid-template-columns:1fr}}')

          old_render = '''function renderOwnerData(){if(!salon)return;$('salonName').value=salon.name||'';$('salonCity').value=salon.city||'';$('salonWhatsapp').value=salon.whatsapp||'';$('salonRating').value=salon.rating||0;$('salonTagline').value=salon.tagline||'';$('heroTitle').textContent=(salon.name||'Your salon')+' — turn visitors into paying customers.';$('heroText').textContent=salon.tagline||'A professional salon page with services, offers, enquiry capture and fast follow-up.';renderGoogle();renderCatalog()}'''
          new_render = '''function renderOwnerData(){if(!salon)return;$('salonName').value=salon.name||'';$('salonCity').value=salon.city||'';$('salonWhatsapp').value=salon.whatsapp||salon.google_phone||'';$('salonRating').value=salon.google_rating||salon.rating||0;$('salonTagline').value=salon.tagline||'';$('heroTitle').textContent=(salon.name||'Your salon')+' — turn visitors into paying customers.';$('heroText').textContent=salon.tagline||'A professional salon page with services, offers, enquiry capture and fast follow-up.';renderProfileSummary();renderGoogle();renderCatalog()}
function renderProfileSummary(){if(!salon)return;const connected=!!salon.google_place_id;const rating=salon.google_rating||salon.rating||0;const count=salon.google_review_count||0;$('profileSummary').innerHTML=connected?'<div class="profileSummaryGrid"><div class="profileSummaryItem"><strong>'+esc(salon.name||'—')+'</strong><span>Business name</span></div><div class="profileSummaryItem"><strong>'+esc(salon.city||'—')+'</strong><span>City</span></div><div class="profileSummaryItem"><strong>'+esc(salon.google_phone||salon.whatsapp||'—')+'</strong><span>Phone / WhatsApp</span></div><div class="profileSummaryItem"><strong>'+(rating?Number(rating).toFixed(1)+' ★':'—')+'</strong><span>Google rating · '+count+' reviews</span></div><div class="profileSummaryItem"><strong>'+esc(salon.google_address||'—')+'</strong><span>Address</span></div><div class="profileSummaryItem"><strong>'+esc(salon.tagline||'—')+'</strong><span>Tagline</span></div></div>':'<div class="muted">Connect your Google Business listing in Auto Setup to populate this profile automatically.</div>'}'''
          if old_render not in s:
              raise SystemExit('renderOwnerData target not found')
          s = s.replace(old_render, new_render)

          old_save = '''async function saveSettings(){if(!salon)return;try{const body={name:$('salonName').value.trim(),city:$('salonCity').value.trim(),whatsapp:$('salonWhatsapp').value.trim(),rating:Number($('salonRating').value||0),tagline:$('salonTagline').value.trim(),updated_at:new Date().toISOString()};const rows=await api('/rest/v1/salons?id=eq.'+salon.id,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});salon=rows[0]||Object.assign(salon,body);renderOwnerData();toast($('settingsNotice'),'Saved.')}catch(e){alert(e.message)}}'''
          new_save = '''function setSettingsEdit(on){document.querySelectorAll('.profileEditForm input').forEach(i=>i.disabled=!on);$('editSettingsBtn').classList.toggle('hidden',on);$('saveSettingsBtn').classList.toggle('hidden',!on);$('cancelSettingsBtn').classList.toggle('hidden',!on);if(!on)renderOwnerData()}
async function saveSettings(){if(!salon)return;try{const body={name:$('salonName').value.trim(),city:$('salonCity').value.trim(),whatsapp:$('salonWhatsapp').value.trim(),rating:Number($('salonRating').value||0),tagline:$('salonTagline').value.trim(),updated_at:new Date().toISOString()};const rows=await api('/rest/v1/salons?id=eq.'+salon.id,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});salon=rows[0]||Object.assign(salon,body);setSettingsEdit(false);toast($('settingsNotice'),'Corrections saved.')}catch(e){alert(e.message)}}'''
          if old_save not in s:
              raise SystemExit('saveSettings target not found')
          s = s.replace(old_save, new_save)

          old_body = "const body={name:p.displayName?.text||salon.name,city:(p.formattedAddress||'').split(',').slice(-2,-1)[0]?.trim()||salon.city,google_place_id:p.id||placeId,google_maps_url:p.googleMapsUri||'',google_website_url:p.websiteUri||'',google_phone:p.nationalPhoneNumber||'',google_address:p.formattedAddress||'',google_rating:p.rating||0,google_review_count:p.userRatingCount||0,google_reviews_url:p.googleMapsUri||'',google_last_synced_at:new Date().toISOString(),onboarding_completed:true};"
          new_body = "const autoName=p.displayName?.text||salon.name;const autoCity=(p.formattedAddress||'').split(',').slice(-2,-1)[0]?.trim()||salon.city;const autoPhone=p.nationalPhoneNumber||salon.google_phone||salon.whatsapp||'';const generatedTagline=(salon.tagline&&salon.tagline!=='Your salon. Your customers. Your growth.')?salon.tagline:(autoCity?autoName+' — professional salon services in '+autoCity:autoName+' — professional salon services');const body={name:autoName,city:autoCity,whatsapp:autoPhone,rating:p.rating||0,tagline:generatedTagline,google_place_id:p.id||placeId,google_maps_url:p.googleMapsUri||'',google_website_url:p.websiteUri||'',google_phone:autoPhone,google_address:p.formattedAddress||'',google_rating:p.rating||0,google_review_count:p.userRatingCount||0,google_reviews_url:p.googleMapsUri||'',google_last_synced_at:new Date().toISOString(),onboarding_completed:true};"
          if old_body not in s:
              raise SystemExit('selectBusiness body target not found')
          s = s.replace(old_body, new_body)

          old_handlers = "$('loginBtn').onclick=signIn;$('appointmentBtn').onclick=()=>{$('leadForm').scrollIntoView({behavior:'smooth'});setTimeout(()=>$('leadName').focus(),250)};$('newLeadBtn').onclick=()=>{switchTab('demo');setTimeout(()=>$('leadForm').scrollIntoView({behavior:'smooth'}),100)};$('leadForm').onsubmit=submitLead;"
          new_handlers = "$('loginBtn').onclick=signIn;$('editSettingsBtn').onclick=()=>setSettingsEdit(true);$('cancelSettingsBtn').onclick=()=>setSettingsEdit(false);$('appointmentBtn').onclick=()=>{$('leadForm').scrollIntoView({behavior:'smooth'});setTimeout(()=>$('leadName').focus(),250)};$('newLeadBtn').onclick=()=>{switchTab('demo');setTimeout(()=>$('leadForm').scrollIntoView({behavior:'smooth'}),100)};$('leadForm').onsubmit=submitLead;"
          if old_handlers not in s:
              raise SystemExit('handler target not found')
          s = s.replace(old_handlers, new_handlers)

          s = s.replace('Salon Lead Machine · Standalone product · v1.1','Salon Lead Machine · Standalone product · v1.2')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Make salon profile auto-populated [skip auto-profile]"
            git push
          fi
