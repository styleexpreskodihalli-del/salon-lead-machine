name: Redesign Salon Score Like Reference
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redesign-score-like-reference.yml'
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved reference layout
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          p=Path('whatsapp-score.html')
          s=p.read_text(encoding='utf-8')

          # Header: exact STall logo on the hero, navigation and primary CTA.
          header='''<header class="top reference-top">
            <a class="reference-brand" href="#top" aria-label="STall Home"><img class="logo" alt="STall logo" src="stall-approved-logo.webp"></a>
            <nav class="reference-nav" aria-label="Primary navigation">
              <a href="#top">Home</a><a href="#score">How It Works</a><a href="#score">Features</a><a href="#pricing">Pricing</a><a href="#result">Success Stories</a><a href="#footer">Blog</a>
            </nav>
            <a class="reference-cta" href="#score">Get Free Score</a>
          </header>'''
          s,n=re.subn(r'<header class="top">.*?</header>',header,s,count=1,flags=re.S)
          if n != 1: raise SystemExit(f'Header replacement count: {n}')

          # Hero: preserve the existing audit wording/features while matching the reference composition.
          hero='''<section class="hero reference-hero" id="top">
            <div class="hero-visual" aria-hidden="true"></div>
            <div class="hero-grid reference-hero-grid">
              <div class="reference-hero-copy">
                <div class="reference-kicker">DISCOVER <b>•</b> CONNECT <b>•</b> GROW</div>
                <h1>SALON<br><span>DIGITAL SCORE</span></h1>
                <p>Find out how your salon performs online and get a personalised report in <strong>2 minutes.</strong></p>
                <div class="features">
                  <div class="feature"><div class="ico">G</div><strong>Google<br>Visibility</strong></div>
                  <div class="feature"><div class="ico">◎</div><strong>Instagram<br>Presence</strong></div>
                  <div class="feature"><div class="ico">★</div><strong>Reviews<br>& Ratings</strong></div>
                  <div class="feature"><div class="ico">◉</div><strong>WhatsApp<br>Readiness</strong></div>
                </div>
                <div class="signature">A stronger online presence<br>brings more clients</div>
              </div>
              <div class="reference-hero-side"><div class="reference-brush">More Visibility ↑<br>More Clients<br>More Growth</div></div>
            </div>
          </section>'''
          s,n=re.subn(r'<section class="hero">.*?</section>',hero,s,count=1,flags=re.S)
          if n != 1: raise SystemExit(f'Hero replacement count: {n}')

          # Give the functional sections stable anchors for the reference navigation.
          s=s.replace('<section class="score-card">','<section class="score-card" id="score">',1)
          s=s.replace('<div class="result"','<div class="result" id="result"',1)
          s=s.replace('<section class="pricing">','<section class="pricing" id="pricing">',1)
          s=s.replace('<footer class="footer">','<footer class="footer" id="footer">',1)

          css=r'''<style>
          /* Approved reference visual system — functional audit markup remains unchanged. */
          body{background:#f7f8fb}
          .wrap{max-width:1280px;padding:0 0 55px}
          .reference-top{position:absolute;top:0;left:0;right:0;width:100%;max-width:none;margin:0;padding:16px 5.5%;background:linear-gradient(180deg,rgba(0,0,0,.62),rgba(0,0,0,0));border:0;z-index:20;color:#fff;display:grid;grid-template-columns:220px 1fr 180px;align-items:center;gap:20px}
          .reference-brand{display:flex;align-items:center;width:170px;height:76px}
          .reference-brand .logo{width:170px;height:76px;object-fit:contain;background:transparent}
          .reference-nav{display:flex;justify-content:center;gap:32px;align-items:center}
          .reference-nav a{color:#fff;text-decoration:none;font-size:13px;font-weight:800;letter-spacing:.02em;white-space:nowrap;opacity:.94}
          .reference-nav a:hover{color:#ff2c91}
          .reference-cta{justify-self:end;background:linear-gradient(135deg,#ed0a78,#ff2c91);color:#fff;text-decoration:none;padding:15px 25px;border-radius:13px;font-weight:950;box-shadow:0 12px 30px rgba(237,10,120,.25);white-space:nowrap}
          .reference-hero{margin:0;min-height:730px;padding:125px 6% 100px;background:#090a0d;position:relative;overflow:hidden}
          .reference-hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,5,7,.98) 0%,rgba(4,5,7,.92) 37%,rgba(4,5,7,.35) 64%,rgba(4,5,7,.05) 100%),radial-gradient(circle at 78% 50%,rgba(217,173,82,.18),transparent 28%);z-index:1}
          .reference-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.25));z-index:2;pointer-events:none}
          .hero-visual{position:absolute;right:0;top:0;width:58%;height:100%;background-image:url('https://images.unsplash.com/photo-1776850476481-2bccba2e35c7?auto=format&fit=crop&fm=jpg&q=82&w=1800');background-size:cover;background-position:center;filter:saturate(.92);z-index:0}
          .reference-hero-grid{position:relative;z-index:3;max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);align-items:center;min-height:505px}
          .reference-hero-copy{max-width:700px}
          .reference-kicker{font-size:12px;letter-spacing:.27em;font-weight:900;color:#fff;margin-bottom:18px}
          .reference-kicker b{color:#e8b947;padding:0 8px}
          .reference-hero h1{font-size:clamp(58px,7.4vw,94px);line-height:.86;margin:0 0 20px;max-width:720px;text-shadow:0 6px 30px rgba(0,0,0,.28)}
          .reference-hero h1 span{color:#ed0a78}
          .reference-hero p{font-size:20px;max-width:650px;color:#f3f3f5}
          .reference-hero .features{max-width:790px;margin-top:28px;grid-template-columns:repeat(4,1fr)}
          .reference-hero .feature{min-height:110px;padding:18px 10px;background:rgba(10,10,12,.58);border:1px solid rgba(255,255,255,.18);border-radius:18px;box-shadow:0 14px 35px rgba(0,0,0,.18)}
          .reference-hero .feature .ico{font-size:34px;color:#fff}
          .reference-hero .signature{color:#f2c55d;font-size:25px;margin-top:28px}
          .reference-hero-side{height:100%;position:relative}
          .reference-brush{position:absolute;right:1%;bottom:18px;background:linear-gradient(120deg,#df006f,#ff218f);color:#fff;padding:20px 27px;transform:rotate(-6deg);font-size:18px;font-weight:950;line-height:1.12;box-shadow:0 18px 40px rgba(0,0,0,.35);clip-path:polygon(2% 12%,96% 0,100% 82%,6% 100%,0 50%)}
          .score-card{margin:-42px auto 0;max-width:1160px;border-radius:28px;padding:38px;box-shadow:0 25px 70px rgba(15,18,30,.16);z-index:10}
          .score-card h2{font-size:34px}
          .input{max-width:1020px}
          .input button{min-width:220px}
          .benefits{max-width:1160px;border-radius:22px;margin-top:18px;padding:26px}
          .quote{padding-top:52px}
          @media(max-width:900px){
            .reference-top{position:absolute;grid-template-columns:1fr auto;padding:10px 18px}.reference-nav{display:none}.reference-cta{padding:12px 15px;font-size:12px}.reference-brand,.reference-brand .logo{width:130px;height:64px}
            .reference-hero{min-height:760px;padding:120px 24px 95px}.hero-visual{width:100%;opacity:.42;background-position:65% center}.reference-hero:before{background:linear-gradient(90deg,rgba(4,5,7,.95),rgba(4,5,7,.62)),linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.7))}.reference-hero-grid{display:block}.reference-hero-copy{max-width:100%}.reference-hero h1{font-size:58px}.reference-hero p{font-size:17px}.reference-hero .features{grid-template-columns:repeat(2,1fr)}.reference-hero-side{height:90px}.reference-brush{right:0;bottom:0}.score-card{margin:-35px 14px 0;padding:25px 18px}.input{display:block}.input button{width:100%;margin-top:10px}.benefits{margin-left:14px;margin-right:14px}
          }
          </style>'''
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          print('Approved reference layout applied.')
          PY
      - name: Commit redesign
        run: |
          git config user.name 'STall Automation'
          git config user.email 'actions@github.com'
          git add whatsapp-score.html
          git diff --cached --quiet && exit 0
          git commit -m 'Match salon digital score page to approved reference'
          git pull --rebase origin main
          git push
