name: Install Google Ads conversion event v2

on:
  push:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire conversion event
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('whatsapp-score.html')
          s = p.read_text(encoding='utf-8')
          tag = 'AW-18444075747/9HxaCIOQ6fMcEOOF6dpE'
          snippet = "gtag('event', 'conversion', { 'send_to': 'AW-18444075747/9HxaCIOQ6fMcEOOF6dpE' });"
          if tag in s:
              print('Conversion event already present')
              raise SystemExit(0)
          marker = 'autoSendAuditToWhatsApp(d)'
          if marker not in s:
              raise SystemExit('Expected successful-score marker not found')
          s = s.replace(marker, snippet + marker, 1)
          p.write_text(s, encoding='utf-8')
          print('Conversion event inserted before WhatsApp redirect')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whatsapp-score.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Wire Google Ads Digital Score conversion event'
          git push
