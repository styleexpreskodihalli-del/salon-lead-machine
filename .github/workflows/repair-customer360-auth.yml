name: Repair Customer 360 Auth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-customer360-auth.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Customer 360 authentication
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('customer360.html')
          s = p.read_text()

          old = "async function auth(){const {data:{session}}=await db.auth.getSession();if(!session)throw new Error('Please sign in with Google from the owner dashboard first.');}"
          new = "async function auth(){let stored=null;try{stored=JSON.parse(localStorage.getItem('slm_session')||'null')}catch(e){}if(stored?.access_token){try{await db.auth.setSession({access_token:stored.access_token,refresh_token:stored.refresh_token||''})}catch(e){}}const {data:{session}}=await db.auth.getSession();if(!session)throw new Error('Please sign in with Google from the owner dashboard first.');}"
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer360.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Customer 360 authentication'
          git push
