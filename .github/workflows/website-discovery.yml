name: Add website business discovery UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch website discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'id="websiteDiscovery"' in s:
              print('Website discovery already present'); raise SystemExit(0)
          css='.websiteDiscovery{margin-top:16px}.websiteGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.websiteItem{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.websiteItem strong{display:block}.websiteItem span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.websitePills{display:flex;gap:7px;flex-wrap:wrap}.websitePill{background:var(--brand2);color:var(--brand);padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800}@media(max-width:850px){.websiteGrid{grid-template-columns:1fr}}'
          marker='.googleBox{background:#f8faf8;border:1px solid var(--line);border-radius:16px;padding:16px}'
          if '.websiteDiscovery{' not in s: s=s.replace(marker,marker+css)
          anchor='<div class="actions"><button id="syncGoogleBtn" class="secondary" type="button">Sync Google</button></div>'
          website='''<div id="websiteDiscovery" class="websiteDiscovery card"><div class="sectionHead"><div><h3>Website Business Discovery</h3><div class="muted">If your Google Business listing has a website, scan its public business information automatically.</div></div><span class="badge">Website</span></div><div class="formGrid"><div class="field full"><label>Website URL</label><input id="websiteUrl" placeholder="https://yourbusiness.com"></div></div><div class="actions"><button id="scanWebsiteBtn" class="primary" type="button">Scan Website</button><span id="websiteStatus" class="notice"></span></div><div id="websiteSummary" class="googleBox">No website has been analyzed yet.</div></div>'''
          if anchor not in s: raise SystemExit('sync anchor not found')
          s=s.replace(anchor,anchor+website,1)
          before='function renderGoogle(){'
          js=r'''async function scanBusinessWebsite(){if(!salon)return;let url=$('websiteUrl').value.trim()||salon.google_website_url||'';if(!url){toast($('websiteStatus'),'No website URL found. Enter the public website URL.',true);return}if(!/^https?:\/\//i.test(url))url='https://'+url;$('websiteStatus').textContent='Scanning website…';$('websiteStatus').className='notice show';try{const data=await edge('website-business-discovery',{url});if(data?.error)throw new Error(data.error);const body={website_url:data.website_url||url,website_title:data.website_title||'',website_description:data.website_description||'',website_email:data.website_email||'',website_hours:data.website_hours||'',website_services:data.website_services||[],website_offers:data.website_offers||[],website_social_links:data.website_social_links||[],website_logo_url:data.website_logo_url||'',website_image_urls:data.website_image_urls||[],website_last_scanned_at:new Date().toISOString()};const rows=await api('/rest/v1/salons?id=eq.'+salon.id,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});salon=rows[0]||Object.assign(salon,body);renderWebsiteSummary();toast($('websiteStatus'),'Website information imported successfully.')}catch(e){toast($('websiteStatus'),e.message||'Website scan failed.',true)}}
function renderWebsiteSummary(){if(!$('websiteSummary')||!salon)return;const url=salon.website_url||salon.google_website_url||'';if(!$('websiteUrl'))return;$('websiteUrl').value=url;if(!url){$('websiteSummary').innerHTML='<div class="muted">No website was found on the Google Business listing. You can enter one above if the business has a website.</div>';return}const services=Array.isArray(salon.website_services)?salon.website_services:[];const offers=Array.isArray(salon.website_offers)?salon.website_offers:[];const socials=Array.isArray(salon.website_social_links)?salon.website_social_links:[];$('websiteSummary').innerHTML='<div class="websiteGrid"><div class="websiteItem"><strong>'+esc(salon.website_title||salon.name||'Website')+'</strong><span>Website title</span></div><div class="websiteItem"><strong>'+esc(salon.website_description||'—')+'</strong><span>Description</span></div><div class="websiteItem"><strong>'+esc(salon.website_email||'—')+'</strong><span>Email</span></div><div class="websiteItem"><strong>'+esc(salon.website_hours||'—')+'</strong><span>Opening hours</span></div><div class="websiteItem"><strong>'+services.length+'</strong><span>Services detected</span></div><div class="websiteItem"><strong>'+offers.length+'</strong><span>Offers detected</span></div></div>'+(services.length?'<div style="margin-top:12px"><b>Services</b><div class="websitePills" style="margin-top:8px">'+services.slice(0,20).map(x=>'<span class="websitePill">'+esc(x)+'</span>').join('')+'</div></div>':'')+(offers.length?'<div style="margin-top:12px"><b>Offers</b><div class="websitePills" style="margin-top:8px">'+offers.slice(0,20).map(x=>'<span class="websitePill">'+esc(x)+'</span>').join('')+'</div></div>':'')+(socials.length?'<div style="margin-top:12px"><b>Social links</b><div class="websitePills" style="margin-top:8px">'+socials.slice(0,10).map(x=>'<span class="websitePill">'+esc(x)+'</span>').join('')+'</div></div>':'')+'<div class="muted" style="margin-top:12px">Last scanned: '+(salon.website_last_scanned_at?new Date(salon.website_last_scanned_at).toLocaleString('en-IN'):'Not scanned yet')+'</div>'}
'''
          if before not in s: raise SystemExit('renderGoogle marker not found')
          s=s.replace(before,js+before,1)
          target='renderProfileSummary();renderGoogle();renderCatalog()'
          s=s.replace(target,'renderProfileSummary();renderWebsiteSummary();renderGoogle();renderCatalog()',1)
          handler="$('loginBtn').onclick=signIn;"
          if "$('scanWebsiteBtn').onclick=scanBusinessWebsite;" not in s: s=s.replace(handler,handler+"$('scanWebsiteBtn').onclick=scanBusinessWebsite;",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
          git commit -m "Add automatic website business discovery [skip auto-profile]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
