name: Embed Premium STall Logo
on:
  push:
    branches: [main]
    paths:
      - 'stall-premium-top.svg'
      - 'stall-premium-footer.svg'
      - '.github/workflows/embed-premium-logo.yml'
permissions:
  contents: write
jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only logo references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('whatsapp-score.html')
          s=p.read_text()
          s=s.replace('src="stall-logo.svg"','src="stall-premium-top.svg"',1)
          s=s.replace('src="stall-footer-logo.svg"','src="stall-premium-footer.svg"',1)
          s=s.replace('src="stall-logo.svg"','src="stall-premium-top.svg"')
          p.write_text(s)
          PY
      - name: Commit logo references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whatsapp-score.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Embed premium STall logo top and footer'
          git push
