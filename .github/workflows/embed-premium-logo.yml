name: Embed Exact Approved STall Logo
on:
  push:
    branches: [main]
    paths:
      - 'stall-exact-approved.svg'
      - 'stall-exact-approved-footer.svg'
      - 'stall-premium-top.svg'
      - 'stall-premium-footer.svg'
      - '.github/workflows/embed-premium-logo.yml'
permissions:
  contents: write
jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact approved logo only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('whatsapp-score.html')
          s=p.read_text()
          s=s.replace('src="stall-premium-top.svg"','src="stall-exact-approved.svg"')
          s=s.replace('src="stall-premium-footer.svg"','src="stall-exact-approved-footer.svg"')
          s=s.replace('src="stall-approved-logo.svg"','src="stall-exact-approved.svg"')
          s=s.replace('src="stall-logo.svg"','src="stall-exact-approved.svg"')
          s=s.replace('src="stall-footer-logo.svg"','src="stall-exact-approved-footer.svg"')
          p.write_text(s)
          PY
      - name: Commit exact logo references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whatsapp-score.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use exact approved STall logo in header and footer'
          git push
