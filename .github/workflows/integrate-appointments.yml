name: Repair Salon Lead Machine booking snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-appointments.yml'

permissions:
  contents: write

jobs:
  repair_workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix dashboard booking snapshot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          # Remove every previous injected snapshot loader. The old versions were
          # duplicated and used browser locale formatting that could mismatch YYYY-MM-DD.
          s = re.sub(r'<script>\(function\(\)\{\s*async function loadBookingSnapshot\(\).*?</script>', '', s, flags=re.S)

          # Add one reliable snapshot renderer that reuses the already authenticated
          # appointments array loaded by the main owner dashboard.
          marker = "async function loadAppointments(){if(!salon)return;appointments=await api('/rest/v1/appointments?salon_id=eq.'+salon.id+'&select=*&order=appointment_date.asc,appointment_time.asc,created_at.desc').catch(()=>[])}"
          fn = r'''function renderBookingSnapshot(){
            const box=$('bookingSnapshotList');
            if(!box||!salon||publicMode)return;
            const pad=n=>String(n).padStart(2,'0');
            const now=new Date();
            const today=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
            const rows=appointments||[];
            const todayRows=rows.filter(x=>x.appointment_date===today);
            const requested=rows.filter(x=>x.status==='Requested').length;
            const confirmed=rows.filter(x=>x.status==='Confirmed').length;
            const completed=rows.filter(x=>x.status==='Completed').length;
            const set=(id,val)=>{const el=$(id);if(el)el.textContent=String(val)};
            set('statLeads',todayRows.length);
            set('statFollow',requested);
            set('statRate',confirmed);
            set('statConverted',completed);
            const rank=(a,b)=>{
              const da=(a.appointment_date||'9999-99-99')+' '+(a.appointment_time||'99:99:99');
              const db=(b.appointment_date||'9999-99-99')+' '+(b.appointment_time||'99:99:99');
              return da.localeCompare(db);
            };
            const upcoming=rows.filter(x=>x.appointment_date>=today&&x.status!=='Cancelled'&&x.status!=='Completed').sort(rank);
            const recent=rows.filter(x=>x.appointment_date<today||x.status==='Completed').sort((a,b)=>rank(b,a));
            const display=upcoming.concat(recent).slice(0,4);
            const safe=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
            box.querySelector('.bookingSnapshotRows').innerHTML=display.length?display.map(x=>{
              const tm=x.appointment_time?String(x.appointment_time).slice(0,5):'';
              return '<div class="bookingSnapshotRow"><div><div class="bookingSnapshotName">'+safe(x.customer_name||'Customer')+'</div><div class="bookingSnapshotMeta">'+safe(x.service||'Service')+' · '+safe(x.appointment_date||'—')+(tm?' · '+safe(tm):'')+(x.source?' · '+safe(x.source):'')+'</div></div><span class="bookingSnapshotStatus">'+safe(x.status||'Requested')+'</span></div>';
            }).join(''):'<div class="bookingSnapshotEmpty">No bookings yet.</div>';
          }'''
          if marker not in s:
              raise SystemExit('loadAppointments marker not found')
          s=s.replace(marker,marker+'\n'+fn,1)

          old="async function loadLeads(){if(!salon)return;leads=await api('/rest/v1/leads?salon_id=eq.'+salon.id+'&select=*&order=created_at.desc').catch(()=>[]);await loadAppointments();renderStats();renderLeads()}"
          new="async function loadLeads(){if(!salon)return;leads=await api('/rest/v1/leads?salon_id=eq.'+salon.id+'&select=*&order=created_at.desc').catch(()=>[]);await loadAppointments();renderStats();renderBookingSnapshot();renderLeads()}"
          if old not in s:
              raise SystemExit('loadLeads marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Keep visited and paid flow intact
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bookings.html')
          s=p.read_text()
          if "mark_appointment_visited_paid" not in s:
              start=s.find('async function changeStatus(')
              end=s.find('async function createBooking(',start)
              if start<0 or end<0: raise SystemExit('Could not locate booking status function')
              fixed='''async function changeStatus(id,status){\n                const a=appointments.find(x=>x.id===id);if(!a)return;\n                if(status==='Completed'){\n                  if(!a.customer_id){notify('This booking has no linked customer record.',true);return}\n                  const amount=Number(prompt('Bill amount paid (₹):','0')||0);\n                  if(!Number.isFinite(amount)||amount<0){notify('Please enter a valid bill amount.',true);return}\n                  const discount=Number(prompt('Discount (₹):','0')||0);\n                  if(!Number.isFinite(discount)||discount<0){notify('Please enter a valid discount amount.',true);return}\n                  const staff=prompt('Stylist / staff name (optional):','')||'';\n                  const notes=prompt('Visit note (optional):','')||'';\n                  const rpc=await api('/rest/v1/rpc/mark_appointment_visited_paid',{method:'POST',body:JSON.stringify({p_appointment_id:a.id,p_amount:amount,p_discount:discount,p_staff_name:staff,p_notes:notes})});\n                  if(!rpc?.success){notify('Could not complete this visit.',true);return}\n                  await loadData();\n                  notify(rpc.already_recorded?'This visit was already recorded. Booking is marked Completed / Paid.':'Visit completed. Bill, customer totals and loyalty updated.');\n                  return;\n                }\n                await api('/rest/v1/appointments?id='+encodeURIComponent(id)+'&salon_id='+encodeURIComponent(salon.id),{method:'PATCH',body:JSON.stringify({status,updated_at:new Date().toISOString()})});\n                await loadData();notify('Booking updated to '+status+'.');\n              }\n              '''
              s=s[:start]+fixed+s[end:]
              p.write_text(s)
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html bookings.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix dashboard booking snapshot'
          git push
