name: Unify customers and calendar experience

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-appointments.yml'

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge Customers and Calendar into one workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()

          # One navigation item only.
          s = re.sub(r'<button data-tab="leads" type="button">.*?</button>', '<button data-tab="leads" type="button">Customers &amp; Calendar</button>', s, count=1)
          s = re.sub(r'<button data-tab="appointments" type="button">.*?</button>', '', s, count=1)

          # Remove the old standalone appointments panel completely.
          s = re.sub(r'<section id="appointments" class="panel">.*?</section>', '', s, count=1, flags=re.S)

          # Rename the customer workspace and insert the calendar inside it.
          s = s.replace('<h2>Lead Dashboard</h2>', '<h2>Customers &amp; Calendar</h2>')
          s = s.replace('<div class="muted">Call, WhatsApp and move leads through your sales pipeline.</div>', '<div class="muted">Manage customers, enquiries, appointments and follow-ups from one workspace.</div>')
          s = s.replace('<span>Total enquiries</span>', '<span>Total customers</span>')

          marker = '<div id="leadTable"></div></section>'
          calendar = '''<div id="leadTable"></div>
          <div class="section card" id="calendarWorkspace">
            <div class="sectionHead"><div><h3>Appointment Calendar</h3><div class="muted">Bookings, confirmations, reschedules, cancellations and completed visits.</div></div><span class="badge">Connected</span></div>
            <iframe id="calendarFrame" title="Appointment Calendar" src="appointments.html" style="width:100%;min-height:760px;border:1px solid var(--line);border-radius:16px;background:#fff"></iframe>
          </div></section>'''
          if marker in s and 'id="calendarWorkspace"' not in s:
              s = s.replace(marker, calendar, 1)

          # Keep the calendar scoped to the currently signed-in salon.
          anchor = "async function loadCatalog(){"
          helper = "function syncCalendar(){const f=document.getElementById('calendarFrame');if(f&&salon)f.src='appointments.html?salon='+encodeURIComponent(salon.id)}\n"
          if 'function syncCalendar()' not in s:
              s = s.replace(anchor, helper + anchor, 1)
          s = s.replace("async function loadSalon(){const rows=", "async function loadSalon(){const rows=", 1)
          load_anchor = "async function loadCatalog(){if(!salon)return;"
          if load_anchor in s and 'syncCalendar();' not in s[s.find(load_anchor):s.find(load_anchor)+300]:
              # sync immediately after salon is loaded by making loadCatalog also sync
              s = s.replace(load_anchor, load_anchor + "syncCalendar();", 1)

          # Calendar no longer needs a navigation handler.
          s = s.replace("document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));", "document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));")

          p.write_text(s)
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Merge customers and calendar workspace'
          git push
