name: Fix Customer 360 workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-appointments.yml'

permissions:
  contents: write

jobs:
  connect_customer_360:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect customer rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('Customers &amp; Calendar', 'Bookings &amp; Customers')
          s = s.replace('Customer Pipeline', 'Bookings &amp; Customers')
          s = s.replace('Total customers', 'Booking Requests')
          s = s.replace('New</span>', 'Pending</span>')
          s = s.replace('Contacted</span>', 'Confirmed</span>')
          s = s.replace('Converted</span>', 'Completed</span>')
          old = re.compile(r'function openCustomer360\(customerId,phone,name\)\{.*?\}', re.S)
          new = "function openCustomer360(customerId,phone,name){if(!salon||(!customerId&&!phone)){alert('Customer record is not available yet.');return}const qs=new URLSearchParams({salon:salon.id,customer:customerId||'',phone:phone||'',name:name||''});location.href='customer360.html?'+qs.toString()}"
          if old.search(s):
              s = old.sub(new, s, count=1)
          elif 'function renderLeads()' in s:
              s = s.replace('function renderLeads()', new + '\nfunction renderLeads()', 1)
          p.write_text(s)
          PY
      - name: Commit Customer 360 connection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Connect customer rows to Customer 360'
          git push
