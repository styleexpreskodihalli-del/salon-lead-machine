name: Repair Salon Lead Machine booking snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-appointments.yml'

permissions:
  contents: write

jobs:
  repair_workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair dashboard functions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          # Restore the catalog renderer if an earlier repair removed it.
          if 'function renderCatalog(){' not in s:
              fn=r'''function renderCatalog(){
                const serviceBox=document.getElementById('services');
                const offerBox=document.getElementById('offers');
                let svc=[];let off=[];
                try{svc=(typeof services!=='undefined'&&Array.isArray(services))?services:[]}catch(e){}
                try{off=(typeof offers!=='undefined'&&Array.isArray(offers))?offers:[]}catch(e){}
                const safe=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
                if(serviceBox){
                  serviceBox.innerHTML=svc.length?svc.map(x=>'<div class="card"><span class="badge">Service</span><h3>'+safe(x.name||x.title||'Service')+'</h3><div class="servicePrice">'+(x.price!=null?'₹'+safe(Number(x.price).toLocaleString('en-IN')):'')+'</div>'+(x.description?'<p class="muted">'+safe(x.description)+'</p>':'')+'</div>').join(''):'<div class="empty">No services added yet.</div>';
                }
                if(offerBox){
                  offerBox.innerHTML=off.length?off.map(x=>'<div class="card offer"><span class="badge">Offer</span><h3>'+safe(x.title||x.name||'Special Offer')+'</h3>'+(x.description?'<p class="muted">'+safe(x.description)+'</p>':'')+(x.price!=null?'<div class="servicePrice">₹'+safe(Number(x.price).toLocaleString('en-IN'))+'</div>':'')+'</div>').join(''):'<div class="empty">No offers added yet.</div>';
                }
              }
              '''
              pos=s.find('function renderBookingSnapshot()')
              if pos<0: pos=s.find('function renderLeads()')
              if pos<0: raise SystemExit('Could not find dashboard render insertion point')
              s=s[:pos]+fn+s[pos:]

          # Restore the dashboard KPI renderer. The current boot sequence calls this
          # after appointments and visit data have been loaded.
          if 'function renderStats(){' not in s:
              fn=r'''function renderStats(){
                const rows=Array.isArray(appointments)?appointments:[];
                const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=String(val)};
                set('dashTotal',rows.length);
                set('dashNew',rows.filter(x=>x.status==='Requested').length);
                set('dashContacted',rows.filter(x=>x.status==='Confirmed').length);
                set('dashConverted',rows.filter(x=>x.status==='Completed').length);
              }
              '''
              pos=s.find('function renderBookingSnapshot()')
              if pos<0: pos=s.find('function renderLeads()')
              if pos<0: raise SystemExit('Could not find dashboard stats insertion point')
              s=s[:pos]+fn+s[pos:]

          if 'function renderBookingSnapshot(){' not in s:
              raise SystemExit('renderBookingSnapshot missing')

          p.write_text(s)
          PY

      - name: Restructure owner dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          nav_old='<nav class="nav" id="nav"><button class="active" data-tab="demo" type="button">Salon Demo</button><button type="button" onclick="location.href=\'bookings.html\'">Bookings &amp; Customers</button><button data-tab="catalog" type="button">Services & Offers</button><button data-tab="setup" type="button">Auto Setup</button><button data-tab="settings" type="button">Salon Setup</button></nav>'
          nav_new='<nav class="nav" id="nav"><button class="active" data-tab="dashboard" type="button">Dashboard</button><button type="button" onclick="location.href=\'bookings.html\'">Bookings &amp; Customers</button><button data-tab="catalog" type="button">Services & Offers</button><button data-tab="demo" type="button">Customer Website</button><button data-tab="setup" type="button">Auto Setup</button><button data-tab="settings" type="button">Salon Setup</button></nav>'
          if nav_old in s:
              s=s.replace(nav_old,nav_new,1)
          elif 'data-tab="dashboard"' not in s:
              raise SystemExit('Could not locate owner navigation')

          css=r'''
          .ownerDashboard{display:grid;gap:22px}.dashboardWelcome{display:flex;justify-content:space-between;align-items:flex-end;gap:18px}.dashboardWelcome h1{margin:5px 0 6px;font-size:34px}.dashboardWelcome p{margin:0;color:var(--muted)}.dashboardDate{font-size:13px;color:var(--muted);white-space:nowrap}.dashKpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.dashKpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.dashKpi strong{display:block;font-size:28px;color:var(--brand)}.dashKpi span{display:block;margin-top:4px;color:var(--muted);font-size:12px}.dashboardGrid{display:grid;grid-template-columns:1fr 1.35fr;gap:16px}.dashboardCard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.dashboardCard h3{margin:0}.dashboardCardHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.attentionCount{font-size:12px;font-weight:900;background:#fff3df;color:#8a5a00;border-radius:999px;padding:5px 9px}.attentionList,.todayList,.activityList{display:grid;gap:9px}.attentionItem,.todayItem,.activityItem{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:13px}.attentionMain,.todayMain,.activityMain{min-width:0}.attentionName,.todayName,.activityName{font-weight:900}.attentionMeta,.todayMeta,.activityMeta{font-size:12px;color:var(--muted);margin-top:3px}.dashboardActions{display:flex;gap:9px;flex-wrap:wrap}.dashboardActions button{padding:10px 13px;border-radius:11px;background:#eef3ef;color:var(--brand);font-weight:900}.dashboardActions button.primary{background:var(--brand);color:#fff}.dashboardPerformance{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.performanceMetric{background:#f8faf8;border:1px solid var(--line);border-radius:13px;padding:14px}.performanceMetric strong{display:block;font-size:21px;color:var(--brand)}.performanceMetric span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.dashboardEmpty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px}.dashboardBadge{font-size:10px;font-weight:900;padding:5px 8px;border-radius:999px;background:var(--brand2);color:var(--brand);white-space:nowrap}.dashboardFooterNote{font-size:12px;color:var(--muted)}
          @media(max-width:850px){.dashboardWelcome{align-items:flex-start;flex-direction:column}.dashKpis{grid-template-columns:repeat(2,1fr)}.dashboardGrid{grid-template-columns:1fr}.dashboardPerformance{grid-template-columns:1fr}.dashboardWelcome h1{font-size:29px}}
          '''
          if '.ownerDashboard{' not in s:
              s=s.replace('</style>',css+'</style>',1)

          dashboard=r'''
          <section id="dashboard" class="panel">
            <div class="ownerDashboard">
              <div class="dashboardWelcome">
                <div><span class="badge">Owner Dashboard</span><h1 id="dashboardGreeting">Good morning</h1><p id="dashboardSubtitle">Here is what needs your attention today.</p></div>
                <div class="dashboardDate" id="dashboardDate"></div>
              </div>
              <div class="dashKpis">
                <div class="dashKpi"><strong id="dbRequests">0</strong><span>Booking Requests</span></div>
                <div class="dashKpi"><strong id="dbConfirmed">0</strong><span>Confirmed Today</span></div>
                <div class="dashKpi"><strong id="dbVisits">0</strong><span>Today's Visits</span></div>
                <div class="dashKpi"><strong id="dbPaid">0</strong><span>Paid Today</span></div>
                <div class="dashKpi"><strong id="dbRevenue">₹0</strong><span>Today's Revenue</span></div>
              </div>
              <div class="dashboardGrid">
                <div class="dashboardCard">
                  <div class="dashboardCardHead"><div><h3>Action Required</h3><div class="muted" style="font-size:12px;margin-top:3px">Booking requests waiting for confirmation.</div></div><span class="attentionCount" id="dbAttentionCount">0</span></div>
                  <div class="attentionList" id="dbAttentionList"><div class="dashboardEmpty">No booking requests need attention.</div></div>
                </div>
                <div class="dashboardCard">
                  <div class="dashboardCardHead"><div><h3>Today's Bookings</h3><div class="muted" style="font-size:12px;margin-top:3px">Your salon's appointments for today.</div></div><button class="ghost" type="button" onclick="location.href='bookings.html'">View all →</button></div>
                  <div class="todayList" id="dbTodayList"><div class="dashboardEmpty">No bookings scheduled for today.</div></div>
                </div>
              </div>
              <div class="dashboardGrid">
                <div class="dashboardCard">
                  <div class="dashboardCardHead"><div><h3>Recent Customer Activity</h3><div class="muted" style="font-size:12px;margin-top:3px">Latest booking activity.</div></div><span class="dashboardBadge">Live</span></div>
                  <div class="activityList" id="dbActivityList"><div class="dashboardEmpty">No recent customer activity.</div></div>
                </div>
                <div class="dashboardCard">
                  <div class="dashboardCardHead"><div><h3>Performance</h3><div class="muted" style="font-size:12px;margin-top:3px">A simple view of today's business.</div></div></div>
                  <div class="dashboardPerformance">
                    <div class="performanceMetric"><strong id="dbMonthRevenue">₹0</strong><span>This month's paid revenue</span></div>
                    <div class="performanceMetric"><strong id="dbCompletedMonth">0</strong><span>Completed this month</span></div>
                    <div class="performanceMetric"><strong id="dbAvgBill">₹0</strong><span>Average paid bill</span></div>
                  </div>
                  <div class="dashboardFooterNote" style="margin-top:12px">Staff performance will appear once a stylist or staff member is assigned when recording a visit.</div>
                </div>
              </div>
              <div class="dashboardCard">
                <div class="dashboardCardHead"><div><h3>Quick Actions</h3><div class="muted" style="font-size:12px;margin-top:3px">Jump straight to the work you need to do.</div></div></div>
                <div class="dashboardActions">
                  <button class="primary" type="button" onclick="location.href='bookings.html'">+ Create Booking</button>
                  <button type="button" onclick="location.href='bookings.html'">View Customers</button>
                  <button type="button" onclick="switchTab('catalog')">Manage Services & Offers</button>
                  <button type="button" onclick="switchTab('demo')">Open Customer Website</button>
                  <button type="button" onclick="switchTab('settings')">Salon Setup</button>
                </div>
              </div>
            </div>
          </section>
          '''
          if '<section id="dashboard"' not in s:
              pos=s.find('<section id="demo"')
              if pos<0: raise SystemExit('Could not find Customer Website section')
              s=s[:pos]+dashboard+s[pos:]

          fn=r'''
          function renderDashboard(){
            if(!salon)return;
            const rows=Array.isArray(appointments)?appointments:[];
            const visits=Array.isArray(window.__slmVisits)?window.__slmVisits:[];
            const localDate=d=>{const x=d instanceof Date?d:new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
            const today=localDate(new Date());
            const nowMonth=today.slice(0,7);
            const todayRows=rows.filter(a=>a.appointment_date===today);
            const requests=rows.filter(a=>a.status==='Requested');
            const confirmed=todayRows.filter(a=>a.status==='Confirmed').length;
            const todayVisits=visits.filter(v=>localDate(v.visited_at)===today);
            const monthVisits=visits.filter(v=>localDate(v.visited_at).slice(0,7)===nowMonth);
            const net=v=>Math.max(0,Number(v.amount||0)-Number(v.discount||0));
            const revenue=todayVisits.reduce((n,v)=>n+net(v),0);
            const monthRevenue=monthVisits.reduce((n,v)=>n+net(v),0);
            const avg=monthVisits.length?monthRevenue/monthVisits.length:0;
            const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=String(val)};
            const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});
            set('dashboardGreeting','Good morning, '+(salon.name||'there'));
            set('dashboardSubtitle','Here is what needs your attention today.');
            set('dashboardDate',new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}));
            set('dbRequests',requests.length);set('dbConfirmed',confirmed);set('dbVisits',todayVisits.length);set('dbPaid',todayVisits.length);set('dbRevenue',money(revenue));set('dbMonthRevenue',money(monthRevenue));set('dbCompletedMonth',monthVisits.length);set('dbAvgBill',money(avg));set('dbAttentionCount',requests.length);
            const attention=document.getElementById('dbAttentionList');
            if(attention){attention.innerHTML=requests.slice(0,5).map(a=>'<div class="attentionItem"><div class="attentionMain"><div class="attentionName">'+esc(a.customer_name||'Customer')+'</div><div class="attentionMeta">'+esc(a.service||'General service')+' · '+esc(a.appointment_date||'Date not set')+(a.appointment_time?' · '+esc(String(a.appointment_time).slice(0,5)):'')+'</div></div><span class="dashboardBadge">Requested</span></div>').join('')||'<div class="dashboardEmpty">No booking requests need attention.</div>'}
            const todayList=document.getElementById('dbTodayList');
            if(todayList){const ordered=todayRows.slice().sort((a,b)=>String(a.appointment_time||'').localeCompare(String(b.appointment_time||'')));todayList.innerHTML=ordered.slice(0,8).map(a=>'<div class="todayItem"><div class="todayMain"><div class="todayName">'+esc(a.customer_name||'Customer')+'</div><div class="todayMeta">'+esc(a.service||'General service')+' · '+esc(a.appointment_time?String(a.appointment_time).slice(0,5):'Time not set')+' · '+esc(a.source||'Website')+'</div></div><span class="dashboardBadge">'+esc(a.status||'Requested')+'</span></div>').join('')||'<div class="dashboardEmpty">No bookings scheduled for today.</div>'}
            const activity=document.getElementById('dbActivityList');
            if(activity){const recent=rows.slice().sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));activity.innerHTML=recent.slice(0,5).map(a=>'<div class="activityItem"><div class="activityMain"><div class="activityName">'+esc(a.customer_name||'Customer')+'</div><div class="activityMeta">'+esc(a.service||'General service')+' · '+esc(a.source||'Website')+'</div></div><span class="dashboardBadge">'+esc(a.status||'Requested')+'</span></div>').join('')||'<div class="dashboardEmpty">No recent customer activity.</div>'}
          }
          '''
          if 'function renderDashboard(){' not in s:
              pos=s.find('function renderBookingSnapshot()')
              if pos<0: pos=s.find('function renderLeads()')
              if pos<0: raise SystemExit('Could not find dashboard function insertion point')
              s=s[:pos]+fn+s[pos:]

          s=s.replace('await loadLeads();showOwner(true);renderOwnerData();switchTab(\'demo\')','await loadLeads();showOwner(true);renderOwnerData();renderDashboard();switchTab(\'dashboard\')',1)
          s=s.replace('await loadSnapshotVisits();renderStats();renderBookingSnapshot();renderLeads()','await loadSnapshotVisits();renderStats();renderBookingSnapshot();renderDashboard();renderLeads()',1)
          p.write_text(s)
          PY

      - name: Keep visited and paid flow intact
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bookings.html')
          s=p.read_text()
          if 'mark_appointment_visited_paid' not in s:
              start=s.find('async function changeStatus(');end=s.find('async function createBooking(',start)
              if start<0 or end<0: raise SystemExit('Could not locate booking status function')
              fixed='''async function changeStatus(id,status){\n                const a=appointments.find(x=>x.id===id);if(!a)return;\n                if(status==='Completed'){\n                  if(!a.customer_id){notify('This booking has no linked customer record.',true);return}\n                  const amount=Number(prompt('Bill amount paid (₹):','0')||0);\n                  if(!Number.isFinite(amount)||amount<0){notify('Please enter a valid bill amount.',true);return}\n                  const discount=Number(prompt('Discount (₹):','0')||0);\n                  if(!Number.isFinite(discount)||discount<0){notify('Please enter a valid discount amount.',true);return}\n                  const staff=prompt('Stylist / staff name (optional):','')||'';\n                  const notes=prompt('Visit note (optional):','')||'';\n                  const rpc=await api('/rest/v1/rpc/mark_appointment_visited_paid',{method:'POST',body:JSON.stringify({p_appointment_id:a.id,p_amount:amount,p_discount:discount,p_staff_name:staff,p_notes:notes})});\n                  if(!rpc?.success){notify('Could not complete this visit.',true);return}\n                  await loadData();notify(rpc.already_recorded?'This visit was already recorded. Booking is marked Completed / Paid.':'Visit completed. Bill, customer totals and loyalty updated.');return;\n                }\n                await api('/rest/v1/appointments?id='+encodeURIComponent(id)+'&salon_id='+encodeURIComponent(salon.id),{method:'PATCH',body:JSON.stringify({status,updated_at:new Date().toISOString()})});\n                await loadData();notify('Booking updated to '+status+'.');\n              }\n              '''
              s=s[:start]+fixed+s[end:];p.write_text(s)
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html bookings.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restructure owner dashboard layout'
          git push
