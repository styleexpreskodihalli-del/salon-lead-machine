name: Route Bookings and Customers workspace

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-appointments.yml'

permissions:
  contents: write

jobs:
  route_bookings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<button data-tab="leads" type="button">Bookings &amp; Customers</button>'
          new='<button data-tab="leads" type="button" onclick="location.href=\'bookings.html\'">Bookings &amp; Customers</button>'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit navigation change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Route bookings navigation to unified workspace'
          git push
