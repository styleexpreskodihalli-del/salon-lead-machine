name: Apply Master STall Logo
on:
  push:
    paths:
      - '.github/workflows/apply-master-stall-logo.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install exact master logo
        env:
          LOGO_B64: ""
        run: |
          echo "$LOGO_B64" | base64 -d > stall-master-logo.webp
      - name: Apply logo to every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          logo='stall-master-logo.webp'
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              # Replace all known previous STall logo assets.
              s=re.sub(r'(src=[\"\'])(?:stall-approved-logo-v2\.webp|stall-approved-logo\.webp|stall-logo\.webp|stall-logo-clean-transparent\.png|stall-exact-logo-transparent\.png)([\"\'])',r'\1'+logo+r'\2',s)
              # Replace embedded logo data URIs used by the main score page.
              s=re.sub(r'src=[\"\']data:image/(?:png|webp);base64,[A-Za-z0-9+/=]+[\"\']','src="'+logo+'"',s)
              # Ensure text-only STall/Salon Lead Machine headers use the same master logo.
              if p.name in {'sales.html'}:
                  s=s.replace('<div class="logo">Salon <span>Lead Machine</span></div>','<div class="logo"><img alt="STall logo" src="'+logo+'"></div>')
              # Keep the exact master artwork visually consistent wherever it is displayed.
              if 'stall-master-logo.webp' in s and 'master-stall-logo-css' not in s:
                  css='''<style id="master-stall-logo-css">.logo img,.stall-brandbar img,.stall-ds-footer img,.footer-mark img,.footer-brand img{width:180px;height:120px;object-fit:cover;object-position:center;display:block}.logo,.stall-brandbar,.footer-brand{display:flex;align-items:center}.stall-brandbar{min-height:120px}.footer-mark{width:180px;height:120px}.footer-mark img{width:180px;height:120px}@media(max-width:700px){.logo img,.stall-brandbar img,.stall-ds-footer img,.footer-mark img,.footer-brand img{width:150px;height:100px}.stall-brandbar{min-height:100px}}</style>'''
                  s=s.replace('</head>',css+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'STall Automation'
          git config user.email 'actions@github.com'
          git add '*.html' stall-master-logo.webp
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Use approved STall master logo on every page'
          git pull --rebase origin main
          git push origin HEAD:main
