name: Fix Footer Logo Transparency
on:
  push:
    branches: [main]
    paths:
      - 'stall-footer-logo.svg'
      - 'whatsapp-score.html'
      - '.github/workflows/footer-transparent.yml'
permissions:
  contents: write
jobs:
  footer-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch footer logo only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('whatsapp-score.html')
          s=p.read_text()
          old='<div class="footer-mark"><img alt="STall logo" src="stall-logo.svg"></div>'
          new='<div class="footer-mark"><img alt="STall logo" src="stall-footer-logo.svg"></div>'
          if old in s:
              p.write_text(s.replace(old,new,1))
          PY
      - name: Commit footer-only change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whatsapp-score.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix footer logo background only'
          git push

# Isolated footer-only patch; top logo and all app logic remain untouched.
