name: Fix STall Logo Now
on:
  push:
    branches: [main]
jobs:
  fix-logo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch logo references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('whatsapp-score.html')
          s=p.read_text()
          import re
          s2=re.sub(r'<img class="logo"([^>]*?)src="data:image/[^;]+;base64,[^"]+"([^>]*)>', r'<img class="logo"\1src="stall-logo.svg"\2>', s)
          s2=re.sub(r'(<img[^>]*?)src="data:image/[^;]+;base64,[^"]+"', r'\1src="stall-logo.svg"', s2)
          if s2 != s:
              p.write_text(s2)
          else:
              print('No embedded logo references found')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whatsapp-score.html stall-logo.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix STall logo rendering"
          git pull --rebase origin main
          git push origin HEAD:main
