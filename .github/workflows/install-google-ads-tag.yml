name: Install Google Ads Tag

on:
  push:
    paths:
      - '.github/workflows/install-google-ads-tag.yml'

permissions:
  contents: write

jobs:
  install-google-ads-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Google Ads global tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('whatsapp-score.html')
          s = p.read_text(encoding='utf-8')
          tag = '''<!-- Google tag (gtag.js) - STall Google Ads -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18444075747"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'AW-18444075747');
          </script>
          '''
          if 'googletagmanager.com/gtag/js?id=AW-18444075747' not in s:
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('Could not find </head> in whatsapp-score.html')
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')
              print('Google Ads tag installed.')
          else:
              print('Google Ads tag already installed; no change needed.')
          PY
      - name: Commit fix
        run: |
          git config user.name 'STall Automation'
          git config user.email 'actions@github.com'
          git add whatsapp-score.html
          git diff --cached --quiet && exit 0
          git commit -m 'Install Google Ads tag AW-18444075747'
          git push
