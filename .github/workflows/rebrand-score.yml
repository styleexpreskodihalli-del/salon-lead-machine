name: Rebrand Salon Digital Score
on:
  push:
    branches: [main]
    paths:
      - 'rebrand_score.py'
      - 'polish_footer.py'
      - '.github/workflows/rebrand-score.yml'
permissions:
  contents: write
jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply STall landing-page design
        run: python3 rebrand_score.py
      - name: Polish footer branding
        run: python3 polish_footer.py
      - name: Normalize embedded STall logo
        run: |
          python3 - <<'PY'
          import base64, re
          from pathlib import Path
          p=Path('whatsapp-score.html')
          s=p.read_text(encoding='utf-8')
          top=re.search(r'data:image/webp;base64,([^\"]+)', s)
          shield=re.search(r'data:image/png;base64,([^\"]+)', s)
          if top and shield:
              svg=f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 128"><rect width="220" height="128" fill="white"/><image href="data:image/png;base64,{shield.group(1)}" x="6" y="8" width="100" height="112" preserveAspectRatio="xMidYMid meet"/><text x="112" y="78" font-family="Arial,sans-serif" font-size="48" font-weight="800" fill="#20232a">all</text><text x="112" y="101" font-family="Arial,sans-serif" font-size="7" letter-spacing="3" fill="#d9ad52">THAT'S ALL</text></svg>'''
              svg64=base64.b64encode(svg.encode()).decode()
              s=s.replace(top.group(0), 'data:image/svg+xml;base64,'+svg64)
              p.write_text(s, encoding='utf-8')
              print('STall logo normalized to SVG')
          else:
              print('Logo normalization skipped')
          PY
      - name: Commit branded page
        run: |
          git config user.name 'STall Automation'
          git config user.email 'actions@github.com'
          git add whatsapp-score.html
          git diff --cached --quiet && exit 0
          git commit -m 'Keep STall logo rendering stable'
          git push
# Keep the production branding workflow authoritative for the score page.
