name: Rebrand Salon Digital Score
on:
  push:
    branches: [main]
    paths:
      - 'rebrand_score.py'
      - 'polish_footer.py'
      - '.github/workflows/rebrand-score.yml'
permissions:
  contents: write
jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply STall landing-page design
        run: python3 rebrand_score.py
      - name: Polish footer branding
        run: python3 polish_footer.py
      - name: Restore exact STall logo
        run: |
          python3 - <<'PY'
          import base64, re
          from pathlib import Path
          p=Path('whatsapp-score.html')
          s=p.read_text(encoding='utf-8')
          logo64='iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAIAAABMXPacAABQoklEQVR42o19d9wcV3X2ObfMzO5bpVeS'
          logo_src='data:image/png;base64,'+logo64
          pattern=r'<div class="brand"><img class="logo" alt="STall logo" src="[^"]*"><div class="brand-name">STall<small>THAT\'S ALL</small></div></div>'
          replacement='<div class="brand"><img class="logo" alt="STall logo" src="'+logo_src+'"></div>'
          s,n=re.subn(pattern,replacement,s,count=1)
          s=s.replace('.logo{width:82px;height:82px;', '.logo{width:118px;height:72px;')
          s=s.replace('.logo{width:68px;height:68px}', '.logo{width:104px;height:64px}')
          p.write_text(s,encoding='utf-8')
          print('Exact STall logo restored; header matches approved branding.')
          print('Header match count:',n)
          PY
      - name: Commit branded page
        run: |
          git config user.name 'STall Automation'
          git config user.email 'actions@github.com'
          git add whatsapp-score.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore exact STall logo'
          git push
# Keep the production branding workflow authoritative for the score page.
