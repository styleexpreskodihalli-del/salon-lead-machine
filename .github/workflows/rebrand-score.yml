name: Rebrand Salon Digital Score
on:
  push:
    branches: [main]
    paths:
      - 'rebrand_score.py'
      - 'polish_footer.py'
      - '.github/workflows/rebrand-score.yml'
permissions:
  contents: write
jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply STall landing-page design
        run: python3 rebrand_score.py
      - name: Polish footer branding
        run: python3 polish_footer.py
      - name: Make STall logo browser-safe
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, re
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          p=Path('whatsapp-score.html')
          s=p.read_text(encoding='utf-8')
          m=re.search(r'data:image/webp;base64,([^\"]+)', s)
          if m:
              im=Image.open(BytesIO(base64.b64decode(m.group(1)))).convert('RGBA')
              out=BytesIO(); im.save(out, format='PNG', optimize=True)
              s=s.replace(m.group(0), 'data:image/png;base64,'+base64.b64encode(out.getvalue()).decode())
              p.write_text(s, encoding='utf-8')
              print('Converted embedded STall logo to PNG')
          else:
              print('Logo already browser-safe')
          PY
      - name: Commit branded page
        run: |
          git config user.name 'STall Automation'
          git config user.email 'actions@github.com'
          git add whatsapp-score.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix STall logo rendering'
          git push
