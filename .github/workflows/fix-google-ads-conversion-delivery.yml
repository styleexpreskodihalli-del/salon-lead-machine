name: Fix Google Ads conversion delivery
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-google-ads-conversion-delivery.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch conversion callback and redirect timing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('whatsapp-score.html')
          s = p.read_text(encoding='utf-8')
          marker = "async function run(v){"
          helper = """function trackDigitalScoreConversion(onComplete){
            let done=false;
            const finish=()=>{if(done)return;done=true;onComplete()};
            if(typeof gtag!=='function'){finish();return}
            try{
              gtag('event','conversion',{
                'send_to':'AW-18444075747/9HxaCIOQ6fMcEOOF6dpE',
                'transport_type':'beacon',
                'event_callback':finish,
                'event_timeout':2000
              });
              setTimeout(finish,2200);
            }catch(e){finish()}
          }
          """
          if 'function trackDigitalScoreConversion' not in s:
              if marker not in s:
                  raise SystemExit('run marker not found')
              s=s.replace(marker,helper+marker,1)
          old="gtag('event', 'conversion', { 'send_to': 'AW-18444075747/9HxaCIOQ6fMcEOOF6dpE' });"
          if old not in s:
              raise SystemExit('conversion call not found')
          s=s.replace(old,"trackDigitalScoreConversion(()=>{",1)
          old_tail="$('status').textContent='✓ Correct nearby Google profile fetched and scored.';autoSendAuditToWhatsApp(d)"
          if old_tail not in s:
              raise SystemExit('success tail not found')
          s=s.replace(old_tail,"$('status').textContent='✓ Correct nearby Google profile fetched and scored.';autoSendAuditToWhatsApp(d)})",1)
          p.write_text(s,encoding='utf-8')
          print('Patched conversion callback and delayed redirect')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whatsapp-score.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Google Ads conversion delivery before redirect'
          git push
