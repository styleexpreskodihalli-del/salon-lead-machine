name: Use Approved STall Hero Asset
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/use-approved-hero-asset.yml'
      - 'stall-hero-person.webp'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point landing page to approved hero asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('whatsapp-score.html')
          s=p.read_text(encoding='utf-8')
          old="https://images.unsplash.com/photo-1776850476481-2bccba2e35c7?auto=format&fit=crop&fm=jpg&q=82&w=1800"
          s=s.replace(old,'stall-hero-person.webp')
          p.write_text(s,encoding='utf-8')
          print('Hero asset switched to stall-hero-person.webp')
          PY
      - name: Commit asset switch
        run: |
          git config user.name 'STall Automation'
          git config user.email 'actions@github.com'
          git add whatsapp-score.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use approved STall hero asset'
          git pull --rebase origin main
          git push
