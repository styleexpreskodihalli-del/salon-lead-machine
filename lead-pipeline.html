<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead Pipeline · Salon Lead Machine</title><style>
:root{--bg:#f5f7f4;--card:#fff;--ink:#17211b;--muted:#68756d;--brand:#164b37;--brand2:#dce9df;--line:#dfe6e0;--gold:#c79b52;--red:#b54747}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.top{position:sticky;top:0;z-index:10;background:rgba(245,247,244,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;font-size:21px}.logo span{color:var(--brand)}.topActions{display:flex;gap:8px;align-items:center}.btn{padding:10px 13px;border-radius:11px;font-weight:800}.primary{background:var(--brand);color:#fff}.secondary{background:#eef3ef;color:var(--brand)}.wrap{max-width:1240px;margin:auto;padding:28px 20px 60px}.hero{background:linear-gradient(135deg,#123e2e,#28654b);color:#fff;border-radius:25px;padding:28px;margin-bottom:18px}.hero h1{margin:7px 0;font-size:clamp(32px,5vw,54px);line-height:1}.hero p{color:#dce9df;max-width:760px;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{display:block;font-size:26px}.stat span{font-size:12px;color:var(--muted)}.toolbar{display:grid;grid-template-columns:1fr 150px 150px;gap:10px;margin:18px 0}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.column{background:#eef3ef;border:1px solid var(--line);border-radius:18px;padding:12px;min-height:300px}.column h3{margin:3px 5px 12px}.count{color:var(--muted);font-size:12px}.cards{display:grid;gap:10px}.lead{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.leadName{font-weight:900;font-size:16px}.meta{color:var(--muted);font-size:12px;margin-top:4px}.source{display:inline-flex;padding:4px 8px;border-radius:999px;background:var(--brand2);color:var(--brand);font-size:11px;font-weight:800;margin-top:8px}.follow{margin-top:10px;padding:8px 10px;background:#fff8e8;border-radius:9px;font-size:12px}.overdue{background:#fff1f1;color:#9b1c1c}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.small{padding:7px 9px;border-radius:9px;background:#f1f5f1;color:var(--brand);font-size:12px;font-weight:800}.empty{padding:25px 12px;text-align:center;color:var(--muted);font-size:13px}.notice{padding:10px 13px;border-radius:11px;background:#edf6ef;color:var(--brand);font-weight:700;margin-bottom:14px;display:none}.notice.show{display:block}.notice.error{background:#fff1f1;color:#9b1c1c}.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modalCard{background:#fff;border-radius:20px;padding:22px;width:min(520px,100%)}.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}.field textarea{min-height:90px;resize:vertical}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.top{padding:12px 15px}.wrap{padding:20px 14px 40px}}
</style></head><body><header class="top"><div class="logo">Salon <span>Lead Machine</span></div><div class="topActions"><a href="./" class="btn secondary">← Dashboard</a></div></header><main class="wrap"><section class="hero"><span class="source">Lead Conversion Workspace</span><h1>Know who needs follow-up.</h1><p>One view for every enquiry: where it came from, what stage it is in, when to follow up and how to contact the customer.</p></section><div id="notice" class="notice"></div><section class="stats"><div class="stat"><b id="total">0</b><span>Total leads</span></div><div class="stat"><b id="newCount">0</b><span>New</span></div><div class="stat"><b id="contacted">0</b><span>Contacted</span></div><div class="stat"><b id="converted">0</b><span>Converted</span></div><div class="stat"><b id="followups">0</b><span>Follow-ups due</span></div></section><div class="toolbar"><input id="search" class="input" placeholder="Search customer, phone or service..."><select id="sourceFilter" class="input"><option value="all">All sources</option><option>Website</option><option>Google</option><option>WhatsApp</option><option>Instagram</option><option>Facebook</option><option>Phone</option><option>Walk-in</option></select><select id="dueFilter" class="input"><option value="all">All follow-ups</option><option value="due">Due / overdue</option><option value="scheduled">Scheduled</option><option value="none">No follow-up</option></select></div><section class="board"><div class="column"><h3>New <span id="newLabel" class="count"></span></h3><div id="newBoard" class="cards"></div></div><div class="column"><h3>Contacted <span id="contactedLabel" class="count"></span></h3><div id="contactedBoard" class="cards"></div></div><div class="column"><h3>Converted <span id="convertedLabel" class="count"></span></h3><div id="convertedBoard" class="cards"></div></div></section></main><div id="modal" class="modal"><div class="modalCard"><h2 style="margin:0">Follow-up</h2><div id="modalCustomer" class="meta"></div><div class="field"><label>Next follow-up</label><input id="followDate" type="datetime-local"></div><div class="field"><label>Notes</label><textarea id="notes" placeholder="What should the owner remember before contacting this customer?"></textarea></div><div class="modalActions"><button id="cancel" class="btn secondary">Cancel</button><button id="save" class="btn primary">Save Follow-up</button></div></div></div><script>(function(){'use strict';const SUPA='https://dhiimviybpbggvuuzwfh.supabase.co',KEY='sb_publishable_IOXACVkfe217drLmK0UCcA_ADmDLTg7';let session=null,salon=null,leads=[],editing=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function stored(){try{return JSON.parse(localStorage.getItem('slm_session')||'null')}catch{return null}}function note(msg,error){$('notice').textContent=msg;$('notice').className='notice show'+(error?' error':'')}async function api(path,opts={}){const h=Object.assign({'apikey':KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'},opts.headers||{});const r=await fetch(SUPA+path,Object.assign({},opts,{headers:h}));const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{}if(!r.ok)throw new Error(d.message||d.error||t||'Request failed');return d}async function getSalon(){const owner=session.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');const claims=JSON.parse(atob(owner));const rows=await api('/rest/v1/salons?owner_id=eq.'+encodeURIComponent(claims.sub)+'&select=*&limit=1');if(!rows[0])throw new Error('Salon workspace not found.');salon=rows[0]}async function load(){leads=await api('/rest/v1/leads?salon_id=eq.'+encodeURIComponent(salon.id)+'&select=*&order=created_at.desc');render()}function matches(l){const q=$('search').value.toLowerCase().trim(),s=$('sourceFilter').value,d=$('dueFilter').value;if(q&&!([l.name,l.phone,l.service,l.message,l.notes].join(' ').toLowerCase().includes(q)))return false;if(s!=='all'&&(l.source||'Website')!==s)return false;const has=!!l.next_follow_up_at;const due=has&&new Date(l.next_follow_up_at)<=new Date();if(d==='due'&&!due)return false;if(d==='scheduled'&&(!has||due))return false;if(d==='none'&&has)return false;return true}function render(){const visible=leads.filter(matches),now=new Date();const n=leads.filter(x=>x.status==='New').length,c=leads.filter(x=>x.status==='Contacted').length,v=leads.filter(x=>x.status==='Converted').length,due=leads.filter(x=>x.next_follow_up_at&&new Date(x.next_follow_up_at)<=now&&x.status!=='Converted').length;$('total').textContent=leads.length;$('newCount').textContent=n;$('contacted').textContent=c;$('converted').textContent=v;$('followups').textContent=due;[['New','newBoard','newLabel'],['Contacted','contactedBoard','contactedLabel'],['Converted','convertedBoard','convertedLabel']].forEach(([status,box,label])=>{const list=visible.filter(x=>x.status===status);$(label).textContent='· '+list.length;$(box).innerHTML=list.length?list.map(card).join(''):'<div class="empty">No leads here.</div>'})}function card(l){const due=l.next_follow_up_at&&new Date(l.next_follow_up_at)<=new Date()&&l.status!=='Converted';return '<article class="lead"><div class="leadName">'+esc(l.name||'Unknown customer')+'</div><div class="meta">'+esc(l.phone||'No phone')+' · '+esc(l.service||'General enquiry')+'</div><span class="source">'+esc(l.source||'Website')+'</span>'+(l.preferred_date?'<div class="meta">Preferred: '+esc(l.preferred_date)+'</div>':'')+(l.next_follow_up_at?'<div class="follow '+(due?'overdue':'')+'">'+(due?'Follow-up due: ':'Follow-up: ')+new Date(l.next_follow_up_at).toLocaleString('en-IN')+'</div>':'')+(l.notes?'<div class="meta" style="margin-top:9px">'+esc(l.notes)+'</div>':'')+'<div class="actions"><button class="small" data-action="call" data-phone="'+esc(l.phone)+'">Call</button><button class="small" data-action="wa" data-phone="'+esc(l.phone)+'" data-name="'+esc(l.name)+'">WhatsApp</button><button class="small" data-action="follow" data-id="'+esc(l.id)+'">Follow-up</button>'+(l.status!=='Converted'?'<button class="small" data-action="next" data-id="'+esc(l.id)+'">→ '+(l.status==='New'?'Contacted':'Converted')+'</button>':'')+'</div></article>'}async function changeStatus(id,status){try{await api('/rest/v1/leads?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({status,updated_at:new Date().toISOString()})});const l=leads.find(x=>x.id===id);if(l)l.status=status;render()}catch(e){note(e.message,true)}}function openFollow(id){editing=leads.find(x=>x.id===id);if(!editing)return;$('modalCustomer').textContent=(editing.name||'Customer')+' · '+(editing.phone||'');$('followDate').value=editing.next_follow_up_at?new Date(new Date(editing.next_follow_up_at).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):'';$('notes').value=editing.notes||'';$('modal').classList.add('show')}async function saveFollow(){if(!editing)return;try{const value=$('followDate').value;await api('/rest/v1/leads?id=eq.'+encodeURIComponent(editing.id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({next_follow_up_at:value?new Date(value).toISOString():null,notes:$('notes').value.trim(),updated_at:new Date().toISOString()})});editing.next_follow_up_at=value?new Date(value).toISOString():null;editing.notes=$('notes').value.trim();$('modal').classList.remove('show');note('Follow-up saved.');render()}catch(e){note(e.message,true)}}document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='call')location.href='tel:'+b.dataset.phone;if(a==='wa')window.open('https://wa.me/'+b.dataset.phone.replace(/\D/g,'')+'?text='+encodeURIComponent('Hi '+b.dataset.name+', this is the salon team. How can we help you?'),'_blank');if(a==='follow')openFollow(b.dataset.id);if(a==='next')changeStatus(b.dataset.id,leads.find(x=>x.id===b.dataset.id)?.status==='New'?'Contacted':'Converted')});$('search').oninput=render;$('sourceFilter').onchange=render;$('dueFilter').onchange=render;$('cancel').onclick=()=>$('modal').classList.remove('show');$('save').onclick=saveFollow;async function boot(){session=stored();if(!session?.access_token){location.href='./';return}try{await getSalon();await load()}catch(e){document.body.innerHTML='<div style="max-width:600px;margin:80px auto;padding:20px"><h2>Unable to load lead pipeline</h2><p>'+esc(e.message)+'</p><a href="./">Back to dashboard</a></div>'}}boot()})();</script></body></html>
