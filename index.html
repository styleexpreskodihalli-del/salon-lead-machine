<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salon Lead Machine</title></head><body><div style="font-family:system-ui;padding:40px;text-align:center">Loading Salon Lead Machine…</div><script>
(async()=>{
  const r=await fetch('index-base.html',{cache:'no-store'});
  if(!r.ok){document.body.innerHTML='<p style="font-family:system-ui;padding:40px">Unable to load Salon Lead Machine.</p>';return;}
  let h=await r.text();
  h=h.replace('<button class="primary" type="button" onclick="location.href=\'bookings.html\'">+ Create Booking</button>','<button class="primary" type="button" onclick="location.href=\'booking.html\'">+ Create Booking</button>');
  h=h.replace('<button type="button" onclick="location.href=\'bookings.html\'">View Customers</button>','<button type="button" onclick="location.href=\'booking.html\'">View Customers</button>');
  h=h.replace('<button type="button" onclick="switchTab(\'catalog\')">Manage Services & Offers</button>','<button id="quickCatalogBtn" type="button">Manage Services & Offers</button>');
  h=h.replace('<button type="button" onclick="switchTab(\'settings\')">Salon Setup</button>','<button id="quickSettingsBtn" type="button">Salon Setup</button>');
  h=h.replace("$('loginBtn').onclick=signIn;", "$('loginBtn').onclick=signIn;$('customerWebsiteBtn')?.addEventListener('click',openCustomerWebsite);$('openCustomerWebsiteBtn')?.addEventListener('click',openCustomerWebsite);$('quickCatalogBtn')?.addEventListener('click',()=>switchTab('catalog'));$('quickSettingsBtn')?.addEventListener('click',()=>switchTab('settings'));");
  document.open();document.write(h);document.close();
})().catch(e=>{document.body.innerHTML='<p style="font-family:system-ui;padding:40px">Unable to load Salon Lead Machine.</p>'});
</script></body></html>
