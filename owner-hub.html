<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salon Lead Machine · Owner Hub</title><style>:root{--g:#164b37;--g2:#28654b;--bg:#f5f7f4;--line:#dfe6e0;--muted:#68756d;--gold:#c79b52}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,sans-serif;color:#17211b}.wrap{max-width:1180px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.brand{font-size:22px;font-weight:950;color:var(--g)}.sub{font-size:13px;color:var(--muted);margin-top:3px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.primary{background:var(--g);color:#fff}.light{background:#fff;color:var(--g);border:1px solid var(--line)}.hero{background:linear-gradient(135deg,#123e2e,#28654b);color:#fff;border-radius:26px;padding:28px;margin-bottom:18px}.hero h1{font-size:42px;line-height:1;margin:10px 0}.hero p{color:#dce9df;max-width:720px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px}.stat b{display:block;font-size:30px;color:var(--g)}.stat span,.muted{color:var(--muted);font-size:13px}.linkbox{background:#f8faf8;border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:8px;word-break:break-all;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{display:inline-block;background:#dce9df;color:var(--g);padding:6px 10px;border-radius:999px;font-size:11px;font-weight:950}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}.step{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:11px;border-radius:12px;font-size:12px}.step b{display:block;margin-bottom:4px}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px}.status{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:#edf6ef;color:var(--g)}.login{max-width:520px;margin:80px auto;text-align:center}.error{color:#9b1c1c}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.hero h1{font-size:34px}}@media(max-width:500px){.steps{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div id="app"><div class="login card">Checking owner session…</div></div></main><script>const SUPA='https://dhiimviybpbggvuuzwfh.supabase.co',KEY='sb_publishable_IOXACVkfe217drLmK0UCcA_ADmDLTg7',REDIRECT=location.origin+location.pathname;let session=null,salon=null,leads=[],appts=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function parse(){const h=new URLSearchParams(location.hash.replace(/^#/,'&'));if(h.get('access_token')){session={access_token:h.get('access_token'),refresh_token:h.get('refresh_token')};localStorage.setItem('slm_session',JSON.stringify(session));history.replaceState({},'',location.pathname)}else{try{session=JSON.parse(localStorage.getItem('slm_session')||'null')}catch{}}}async function api(path,opt={}){return fetch(SUPA+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...(opt.headers||{})}})}function login(){location.assign(SUPA+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(REDIRECT))}function logout(){localStorage.removeItem('slm_session');location.reload()}async function boot(){parse();if(!session){$('app').innerHTML='<div class="login card"><span class="badge">OWNER ACCESS</span><h1>Salon Lead Machine</h1><p class="muted">Sign in to manage your salon, public links, leads and appointments.</p><button class="btn primary" onclick="login()">Continue with Google</button></div>';return}try{const r=await api('/rest/v1/salons?select=id,name,city,whatsapp,rating,tagline&limit=1');const a=await r.json();if(!a[0])throw Error('No salon is connected to this owner account. Complete Salon Setup first.');salon=a[0];render();await refresh()}catch(e){$('app').innerHTML='<div class="login card"><h2>Salon setup required</h2><p class="muted">'+esc(e.message)+'</p><a class="btn light" href="index.html">Open Salon Setup</a></div>'}}function render(){const base=location.origin+location.pathname.replace('owner-hub.html','');const publicUrl=base+'salon.html?salon='+encodeURIComponent(salon.id);const bookingUrl=base+'booking.html?salon='+encodeURIComponent(salon.id);$('app').innerHTML='<header class="top"><div><div class="brand">Salon Lead Machine</div><div class="sub">Owner Hub · '+esc(salon.name)+' · '+esc(salon.city||'')+'</div></div><div class="actions"><a class="btn light" href="index.html">Main Dashboard</a><button class="btn primary" onclick="logout()">Sign out</button></div></header><section class="hero"><span class="badge">YOUR SALON IS CONNECTED</span><h1>'+esc(salon.name)+'</h1><p>Your salon identity powers one connected customer journey: public salon page → booking → lead → appointment → owner follow-up.</p><div class="actions"><a class="btn light" target="_blank" href="'+publicUrl+'">Open My Salon</a><a class="btn light" target="_blank" href="'+bookingUrl+'">Open Booking</a><a class="btn primary" href="appointments.html">Manage Appointments</a></div><div class="steps"><div class="step"><b>1 · Discover</b>Google / Instagram / WhatsApp</div><div class="step"><b>2 · Visit</b>Salon public page</div><div class="step"><b>3 · Book</b>Customer request</div><div class="step"><b>4 · Capture</b>Lead + appointment</div><div class="step"><b>5 · Convert</b>Owner follow-up</div></div></section><section class="grid"><div class="card stat"><b id="leadCount">0</b><span>Total Leads</span></div><div class="card stat"><b id="apptCount">0</b><span>Appointments</span></div><div class="card stat"><b id="confirmed">0</b><span>Confirmed</span></div></section><section class="grid" style="margin-top:14px"><div class="card"><span class="badge">PUBLIC SALON PAGE</span><h2>My Salon Link</h2><p class="muted">Use this everywhere: Google, Instagram, Facebook, WhatsApp and QR codes.</p><div class="linkbox" id="publicLink">'+esc(publicUrl)+'</div><div class="actions"><button class="btn primary" onclick="copyText(\''+esc(publicUrl).replace(/'/g,"\\'")+'\')">Copy Salon Link</button><a class="btn light" target="_blank" href="'+publicUrl+'">Preview</a></div></div><div class="card"><span class="badge">BOOKING LINK</span><h2>Direct Booking</h2><p class="muted">Customers can book directly. Their request is linked to this salon automatically.</p><div class="linkbox">'+esc(bookingUrl)+'</div><div class="actions"><button class="btn primary" onclick="copyText(\''+esc(bookingUrl).replace(/'/g,"\\'")+'\')">Copy Booking Link</button><a class="btn light" target="_blank" href="'+bookingUrl+'">Test Booking</a></div></div><div class="card"><span class="badge">QR READY</span><h2>Salon QR Code</h2><p class="muted">Generate a QR code for your counter, visiting cards and posters.</p><div class="actions"><button class="btn primary" onclick="qr()">Generate QR</button></div><div id="qrout"></div></div></section><section class="grid" style="margin-top:14px"><div class="card"><h2>Recent Appointments</h2><div id="recentAppts" class="list"><div class="muted">Loading…</div></div><div class="actions"><a class="btn light" href="appointments.html">View All Appointments</a></div></div><div class="card"><h2>Recent Leads</h2><div id="recentLeads" class="list"><div class="muted">Loading…</div></div><div class="actions"><a class="btn light" href="lead-pipeline.html">Open Lead Pipeline</a></div></div><div class="card"><h2>Customer Journey</h2><p class="muted">Every booking carries the salon ID and source into the system.</p><div class="row"><span>Website</span><span class="status">Lead + Booking</span></div><div class="row"><span>Google</span><span class="status">Source tracked</span></div><div class="row"><span>WhatsApp</span><span class="status">Source tracked</span></div><div class="row"><span>Instagram / Facebook</span><span class="status">Source tracked</span></div></div></section>'}async function refresh(){const [lr,ar]=await Promise.all([api('/rest/v1/leads?salon_id=eq.'+encodeURIComponent(salon.id)+'&select=id,name,phone,service,status,source,created_at&order=created_at.desc&limit=5'),api('/rest/v1/appointments?salon_id=eq.'+encodeURIComponent(salon.id)+'&select=id,customer_name,customer_phone,service,appointment_date,appointment_time,status,source&order=appointment_date.asc,appointment_time.asc&limit=5')]);leads=await lr.json();appts=await ar.json();$('leadCount').textContent=Array.isArray(leads)?leads.length:'0';$('apptCount').textContent=Array.isArray(appts)?appts.length:'0';$('confirmed').textContent=Array.isArray(appts)?appts.filter(x=>x.status==='Confirmed').length:0;$('recentLeads').innerHTML=leads.length?leads.map(x=>'<div class="row"><div><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.service||'General')+' · '+esc(x.source||'Website')+'</div></div><span class="status">'+esc(x.status)+'</span></div>').join(''):'<div class="muted">No leads yet.</div>';$('recentAppts').innerHTML=appts.length?appts.map(x=>'<div class="row"><div><b>'+esc(x.customer_name)+'</b><div class="muted">'+esc(x.appointment_date)+(x.appointment_time?' · '+esc(x.appointment_time):'')+' · '+esc(x.service||'General')+'</div></div><span class="status">'+esc(x.status)+'</span></div>').join(''):'<div class="muted">No appointments yet.</div>'}async function copyText(t){try{await navigator.clipboard.writeText(t);alert('Link copied.')}catch{prompt('Copy this link:',t)}}function qr(){const url=location.origin+location.pathname.replace('owner-hub.html','')+'booking.html?salon='+encodeURIComponent(salon.id);$('qrout').innerHTML='<div style="margin-top:12px;text-align:center"><img alt="Booking QR" style="width:180px;height:180px;border:8px solid #fff" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(url)+'"><div class="muted" style="margin-top:6px">Scan to book</div></div>'}boot();</script></body></html>
